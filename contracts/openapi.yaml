openapi: 3.1.0
info:
  title: conpass API
  version: 0.1.0
  description: >
    Loyalty & membership platform API. Single source of truth (contract-first).
    Backend is the authority for balances; wallet passes are display-only.
    Each tag maps to one single-responsibility Lambda service under backend/services.
  contact:
    name: conpass engineering
servers:
  - url: https://api.conpass.cards
    description: Production (frontend is served from https://conpass.cards)
  - url: http://localhost:3000
    description: Local (serverless offline)

tags:
  - name: health
    description: Liveness. Service:health
  - name: me
    description: Current authenticated identity. Service:identity
  - name: demo
    description: Public self-serve demo tenant context. Service:merchants
  - name: merchants
    description: Merchant (tenant) onboarding & subscription. Service:merchants
  - name: programs
    description: Loyalty/membership program config. Service:programs
  - name: enrollment
    description: Public customer enrollment → issue card. Service:enrollment
  - name: cards
    description: Issued card instances & wallet links. Service:cards
  - name: operations
    description: In-store accrue / redeem / validate. Service:operations
  - name: birthday
    description: Birthday benefit automation. Service:birthday
  - name: admin
    description: Platform-admin (cross-tenant). Service:admin
  - name: notifications
    description: >-
      Wallet notifications — automations, manual sends, audiences, history (Phase 16).
      Service:notifications (HTTP) + notifier (scheduled dispatcher, no HTTP).
  - name: reports
    description: Read-only merchant reports — second visit, cohorts, campaigns, levels, branches, export (Phase 18). Service:reports

security:
  - supabaseJwt: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Resolve the caller's identity, roles and tenant
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Set the caller's own password and clear the forced-change flag
      description: >
        Used on first login after a temporary password was emailed (Identity.mustChangePassword).
        Sets the new password and clears `must_change_password` in one Supabase admin update.
        The client must then sign in again with the new password (refresh tokens may be revoked).
        Refused (403) for the shared demo owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /demo:
    get:
      tags: [demo]
      operationId: getDemoContext
      summary: Public self-serve demo tenant context + shared test credentials
      description: >
        Returns the most-recently created demo merchant, its fixed (pinned) stamps
        campaign, and the shared demo login, so the unauthenticated /demo sandbox can
        silently sign in and walk the full journey. Demo logins only ever see
        demo-flagged data (tenant RLS).
      security: []
      responses:
        "200":
          description: Demo context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoContext" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payment-settings:
    get:
      tags: [merchants]
      operationId: getPaymentSettings
      summary: Public — platform transfer/DEUNA account details shown on the signup page
      description: >
        The account a subscribing merchant transfers into (Función 02 · B2B): bank,
        account number, beneficiary, plus the DEUNA QR image. Platform-admin maintains
        these in Función 04, so they can change without a redeploy. Public by design —
        this is exactly the information a payer needs before transferring.
      security: []
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }

  /plans:
    get:
      tags: [merchants]
      operationId: listPlans
      summary: Public — the self-service plan catalog (price, inclusions, overage, features)
      description: >
        Single source of truth for pricing (business model §3, D17). Signup, the
        merchant panel and the admin console all read prices from here; nothing in the
        PWA hardcodes a price. Enterprise / white-label is off-catalog and never listed.
      security: []
      responses:
        "200":
          description: Plans, cheapest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }

  /payment-proofs/upload-url:
    post:
      tags: [merchants]
      operationId: createPaymentProofUploadUrl
      summary: Public — presigned S3 PUT URL for a manual-transfer payment proof
      description: >
        Signup is unauthenticated, and the proof must exist *before* the account can be
        activated, so this endpoint is public. It returns a short-lived presigned PUT to
        a PRIVATE bucket (receipts carry names, accounts and amounts); the returned
        storage key is submitted back as `payment.proofStorageKey` on POST /merchants,
        and only platform-admin can read the object back.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentProofUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofUploadResult" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants:
    post:
      tags: [merchants]
      operationId: onboardMerchant
      summary: Onboard a merchant (B2B signup → tenant + subscription + owner)
      description: >
        Payment is recorded as manual proof for now (PaymentProvider stub). For the
        manual-transfer / DEUNA methods `payment.proofStorageKey` is REQUIRED — the
        account cannot be activated without a receipt for platform-admin to confirm.
        The owner's temporary password is EMAILED to contactEmail (never returned);
        `ownerInviteSent` is false when that email could not be sent — the account still
        exists and platform-admin can resend credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantOnboardRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOnboardResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants/{merchantId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: getMerchant
      summary: Get a merchant profile + subscription
      responses:
        "200":
          description: Merchant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/usage:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: getMerchantUsage
      summary: Current plan, consumption against its inclusions, and the estimated monthly bill
      description: >
        Two-layer pricing (D17) — subscription + consumption. Active cards are a LEVEL
        metric (cards currently active, counted now), billed above the plan's inclusion
        at the plan's per-card rate. Notifications are counted per calendar month
        (push-delivered wallet notifications). The figure is an ESTIMATE for the manual
        billing workflow, not a charge. merchant_owner of that merchant, or platform_admin.
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/operation-users:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listOperationUsers
      summary: List cashier/operation accounts (tier-limited)
      responses:
        "200":
          description: Operation users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationUser" }
    post:
      tags: [merchants]
      operationId: addOperationUser
      summary: Add a cashier/operation account (enforces tier limit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUser" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /merchants/{merchantId}/operation-users/{operationUserId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/OperationUserId"
    patch:
      tags: [merchants]
      operationId: updateOperationUser
      summary: Edit a cashier/operation account (name / email / station)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [merchants]
      operationId: deleteOperationUser
      summary: Remove a cashier/operation account
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/operation-users/{operationUserId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/OperationUserId"
    post:
      tags: [merchants]
      operationId: resetOperationUserPassword
      summary: Issue a new temporary password for a cashier/operation account
      responses:
        "200":
          description: New temporary password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUserPasswordReset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List programs for the caller's merchant
      parameters:
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Program" }
    post:
      tags: [programs]
      operationId: createProgram
      summary: Create & publish a program (enforces tier program limit)
      description: >
        In the public demo, a visitor-created campaign lives 30 minutes (demoExpiresAt)
        and at most 10 can be live at once: beyond that, 429 with details.reason
        demo_campaign_limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [programs]
      operationId: updateProgram
      summary: Update program parameters / appearance / active state
      description: >
        In the public demo, a pinned campaign (demoPinned) cannot be changed: 403 with
        details.reason demo_pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /programs/{programId}/appearance-upload-url:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      tags: [programs]
      operationId: createAppearanceUploadUrl
      summary: Presigned S3 PUT URL for a program icon / background asset
      description: >
        Owner-only. Returns a short-lived presigned S3 PUT URL the browser uploads
        the image to directly, plus the storage key to persist via PATCH /programs
        and the public URL used on the card + Google Wallet pass.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppearanceUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceUploadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /programs/{programId}/enroll:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [enrollment]
      operationId: getEnrollPreview
      summary: Public — what the customer is about to save (card preview on the 1-tap page)
      description: >
        Public facts of one campaign for the enrolment page (board 09): business, campaign,
        goal, reward, look, status and whether the merchant offers a birthday gift (Pro with
        birthdays on — drives the optional step after saving, board 20). No personal data.
        404 for an unknown program.
      security: []
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollPreview" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [enrollment]
      operationId: enrollCustomer
      summary: Public enrollment — issue a card for a customer
      description: >
        Critical B2C path: minimal/optional PII (data minimization). Returns the
        card with wallet add-links. Idempotent on (programId, dedupe key). Only an
        `active` campaign (see CampaignStatus) enrols: otherwise 422 with code
        `campaign_not_active` and details {status, validFrom?, validUntil?}. A
        seasonal_discount card is issued with one discount available.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Card issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardIssued" }
        "200":
          description: Idempotent replay — existing card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardIssued" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [cards]
      operationId: getCard
      summary: Get a card (balance is backend-authoritative)
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards/{cardId}/wallet-links:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [cards]
      operationId: getWalletLinks
      summary: Get (re)generated Add-to-Wallet links for a card
      responses:
        "200":
          description: Wallet links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletLinks" }

  /operations/resolve:
    post:
      tags: [operations]
      operationId: resolveScan
      summary: Resolve a scanned opaque token to a card + current balance
      description: Used by the cashier station after a QR scan or manual code entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanResolveRequest" }
      responses:
        "200":
          description: Resolved card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResolution" }
        "404": { $ref: "#/components/responses/NotFound" }

  /operations/accrue:
    post:
      tags: [operations]
      operationId: accrue
      summary: Accrue stamps or points (idempotent, offline-replayable)
      description: >
        Backend-authoritative mutation. Requires an Idempotency-Key; safe to replay
        after offline queueing. Enforces per-window fraud limits. Triggers async
        wallet-object update.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccrueRequest" }
      responses:
        "200":
          description: Accrued (new or idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /operations/redeem:
    post:
      tags: [operations]
      operationId: redeem
      summary: Redeem a reward (idempotent, server-validated)
      description: >
        For seasonal_discount this APPLIES THE DISCOUNT (one use per card). It requires the
        campaign to be `active` — otherwise 422 `campaign_not_active` with details
        {status, validFrom, validUntil} — and a second use is 409 `discount_already_used`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /operations/validate-access:
    post:
      tags: [operations]
      operationId: validateAccess
      summary: Validate a membership pass access (gym/event)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateAccessRequest" }
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessDecision" }

  /programs/{programId}/redemptions:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [operations]
      operationId: listRedemptions
      summary: Redemption report for a program
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }

  /programs/{programId}/metrics:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgramMetrics
      summary: Key metrics for a program (installs, second-visit, churn, redemptions)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramMetrics" }

  /programs/{programId}/birthday-automation:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    put:
      tags: [birthday]
      operationId: setBirthdayAutomation
      summary: Configure automatic birthday benefit issuance
      description: Pro only (feature `automated_campaigns`); other plans get 402 `feature_not_in_plan`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirthdayAutomation" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BirthdayAutomation" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /birthday-cards:
    post:
      tags: [birthday]
      operationId: issueBirthdayCard
      summary: Issue a unique birthday benefit card for a customer
      description: Pro only (feature `automated_campaigns`); other plans get 402 `feature_not_in_plan`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirthdayCardCreate" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BirthdayCard" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /admin/clients:
    get:
      tags: [admin]
      operationId: listClients
      summary: Platform-admin — list all B2B clients with payment status
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminClient" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/clients/{merchantId}/subscription:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    patch:
      tags: [admin]
      operationId: updateSubscription
      summary: Platform-admin — change plan / mark paid / suspend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/clients/{merchantId}/payment-proof:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [admin]
      operationId: getClientPaymentProof
      summary: Platform-admin — short-lived link to the client's manual-transfer receipt
      description: >
        The proof lives in a private bucket; this mints a presigned GET so the admin can
        inspect it before marking the subscription paid. 404 when the client never
        uploaded one.
      responses:
        "200":
          description: Presigned download target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofLink" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/clients/{merchantId}/resend-credentials:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: resendOwnerCredentials
      summary: Platform-admin — issue a new temporary password for the owner and email it
      description: >
        Resets the owner's password to a fresh temporary one, re-flags the forced change
        at next login, and emails it. 409 for the demo merchant (shared password).
        503 when email is not configured (nothing changed). 502 when the password WAS
        reset but the email failed — retry, which issues another password.
      responses:
        "200":
          description: Credentials emailed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsResent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/EmailDeliveryFailed" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /admin/payment-settings:
    patch:
      tags: [admin]
      operationId: updatePaymentSettings
      summary: Platform-admin — edit the transfer/DEUNA details shown on signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/payment-settings/qr-upload-url:
    post:
      tags: [admin]
      operationId: createPaymentQrUploadUrl
      summary: Platform-admin — presigned S3 PUT URL for the DEUNA QR image
      description: >
        The QR is displayed on the public signup page, so it goes to the public-read
        assets bucket; persist the returned `storageKey` via PATCH /admin/payment-settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentQrUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceUploadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/stats:
    get:
      tags: [admin]
      operationId: getPlatformStats
      summary: Platform-admin — MRR, active clients, overdue
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /merchants/{merchantId}/locations:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listLocations
      summary: The merchant's locales (stores) — every plan
      description: >
        Locales serve two purposes: the cashier picks one at scan time (so visits are
        attributed to a store), and up to 10 ACTIVE ones are sent to every program's
        wallet class as nearby-notification points — that second part only on plans with
        `nearby_notifications` (Growth+); on Starter they are stored and activate on upgrade.
      responses:
        "200":
          description: Locales, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [merchants]
      operationId: createLocation
      summary: Register a locale (name + decimal latitude/longitude)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "409":
          description: >-
            Would exceed 10 active locales (details.reason = active_location_limit). Create
            it with active=false, or pause another first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants/{merchantId}/locations/{locationId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/LocationId"
    patch:
      tags: [merchants]
      operationId: updateLocation
      summary: Edit / pause / resume a locale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Activating it would exceed 10 active locales (details.reason = active_location_limit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [merchants]
      operationId: deleteLocation
      summary: Delete a locale (past visits keep their history, unattributed)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The merchant's automations, balance-expiry window and per-card locations
      description: >
        Returns defaults when the merchant never saved settings. `platformRules` is
        read-only here (platform-admin sets it) and applies to automations and manual sends.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Save automations, balance-expiry window and per-card locations
      description: >
        Full replace. Enabling `inactive` needs `automated_campaigns` (Pro) → 402
        feature_not_in_plan. `expiry.enabled` with `balanceExpiryDays` null is accepted and
        inert (nothing expires, nothing is warned). warnDays not below balanceExpiryDays → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications/audiences:
    get:
      tags: [notifications]
      operationId: getNotificationAudiences
      summary: How many cards each manual-send audience reaches right now
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationAudiences" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: History — manual sends and daily automation batches, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Send (or schedule) a manual notification to an audience
      description: >
        Every plan may send `general` to `all`, without a link. `event`, `flash`, any other
        audience and `url` need `manual_campaigns` (Growth+) → 402 feature_not_in_plan.
        Delivery is asynchronous: the dispatcher applies the platform rules (daily cap per
        card, quiet hours) and pushes within about a minute. Notifications above the plan's
        inclusion are billed, never blocked (D17).
        **Public demo merchant** (is_demo): at most 3 manual sends per Ecuador day (any
        status, scheduled or cancelled included) → 429 `rate_limited` with
        details.reason = demo_daily_limit; its cards are deactivated 7 days after
        enrolment, so only recent demo cards receive anything; automations never run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationCreate" }
      responses:
        "202":
          description: Accepted — queued, or scheduled when scheduledAt is in the future
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    delete:
      tags: [notifications]
      operationId: cancelNotification
      summary: Cancel a scheduled notification that has not started sending
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      tags: [notifications]
      operationId: updateNotification
      summary: Edit a scheduled notification before it starts sending (Programados · Editar)
      description: >
        Only while status = scheduled (else 409). Partial update with the same rules and plan
        gates as createNotification, validated on the merged result; scheduledAt must stay in
        the future (max 60 days ahead).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notification-rules:
    get:
      tags: [admin]
      operationId: getNotificationRules
      summary: Platform-admin — sending rules applied to every merchant
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformNotificationRules" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updateNotificationRules
      summary: Platform-admin — change the daily cap per card and quiet hours
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformNotificationRulesUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformNotificationRules" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ------------------------------------------------------------------------------------
  # Phase 18 — console redesign + business model v3.0 (D21, docs/design/PHASE-18-CONSOLE.md)
  # ------------------------------------------------------------------------------------

  /auth/forgot-password:
    post:
      tags: [me]
      operationId: requestPasswordResetCode
      summary: Public — e-mail a 6-digit code to reset the password
      description: >
        Always 202, whether or not the address has an account (no user enumeration). When it
        does, a 6-digit code valid 15 minutes is e-mailed (D18 SMTP) and any earlier unused
        code for that address stops working. At most 3 requests per address per 15 minutes →
        429 rate_limited (details.reason too_many_requests). The demo owner never gets a code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: Accepted }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/reset-password:
    post:
      tags: [me]
      operationId: resetPasswordWithCode
      summary: Public — set a new password with the e-mailed code
      description: >
        422 details.reason: invalid_code (wrong code; counts an attempt), expired_code
        (older than 15 minutes, already used, or superseded), too_many_attempts (5 wrong
        tries burn the code), weak_password, same_password. On success the code is used,
        any temporary-password flag is cleared and the user can sign in at once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetWithCode" }
      responses:
        "204": { description: Password changed }
        "422": { $ref: "#/components/responses/ValidationError" }

  /reports/summary:
    get:
      tags: [reports]
      operationId: getReportSummary
      summary: Home + campaign-list figures — second visit (30 days, with counts and the previous window), redemptions this month, per-campaign cards and redemptions
      description: >
        The merchant comes from the caller (owner or manager); platform_admin passes
        merchantId. A manager's figures are limited to their branches.
      parameters:
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/overview:
    get:
      tags: [reports]
      operationId: getReportOverview
      summary: Reports page — KPIs, weekly second-visit cohorts, per campaign, per level, per branch
      description: >
        Every number on the page moves together with the filters. `locationId` and the
        `branches` block need `branch_reports` (Pro) → 402 when filtered by branch without
        it; without it `branches` is simply omitted. A manager is always limited to their
        branches (and may filter among them).
      parameters:
        - $ref: "#/components/parameters/MerchantIdQuery"
        - name: weeks
          in: query
          required: false
          schema: { type: integer, enum: [4, 8, 12], default: 8 }
        - name: programId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportOverview" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/export:
    get:
      tags: [reports]
      operationId: exportReport
      summary: Pro — download a report section as CSV (UTF-8 with BOM, opens in Excel)
      description: Needs `data_export` (Pro) → 402. Same filters as /reports/overview.
      parameters:
        - $ref: "#/components/parameters/MerchantIdQuery"
        - name: section
          in: query
          required: true
          schema: { type: string, enum: [cohorts, campaigns, levels, branches, redemptions] }
        - name: weeks
          in: query
          required: false
          schema: { type: integer, enum: [4, 8, 12], default: 8 }
        - name: programId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema: { type: string }
        "402": { $ref: "#/components/responses/TierLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /operations/recent:
    get:
      tags: [operations]
      operationId: listRecentOperations
      summary: The cashier's latest operations (scan screen) — newest first
      description: >
        An operation user sees their own operations; the owner sees the merchant's. Narrowed
        to one locale with locationId. Customer names are shortened (first name + initial).
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Operations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecentOperation" }

  /operations/{transactionId}/undo:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    post:
      tags: [operations]
      operationId: undoOperation
      summary: Undo an accrual or redemption while the "Listo" screen still shows (O3)
      description: >
        Allowed only for the user who made the operation, within 30 seconds of it, when it
        is still the card's latest operation and was not undone already. Writes a `reversal`
        transaction, stamps the original `reversedAt`, restores the balance (and the level a
        redemption raised) and re-syncs the wallet pass. Replays with the same
        Idempotency-Key return the same result. 409 details.reason: undo_window_closed,
        not_latest, already_reversed, not_undoable (kind cannot be undone).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reversed — the card after the undo, and the reversal transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /programs/{programId}/enroll/birthday:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    put:
      tags: [enrollment]
      operationId: setCardBirthday
      summary: Public — the customer leaves (or clears) their birthday, day and month only
      description: >
        Optional, asked after the card is saved. Authorised by the card's opaque token
        (the secret already in the customer's QR) or by the signed token of the pass-back
        birthday link (conpass_common.card_links), never by login. The year is never asked
        nor stored (D15). Sending day and month null clears it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardBirthdayUpdate" }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants/{merchantId}/payments:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listMerchantPayments
      summary: The merchant's payments, newest first (Ajustes · Plan y facturación)
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /merchants/{merchantId}/payments/{paymentId}/receipt:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [merchants]
      operationId: getMerchantPaymentReceipt
      summary: Short-lived link to the receipt the merchant uploaded for a payment
      responses:
        "200":
          description: Presigned download target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofLink" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/plan-change:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listPlanChanges
      summary: The merchant's plan-change requests, newest first (at most 10)
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlanChangeRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [merchants]
      operationId: requestPlanChange
      summary: Ask to change plan or billing period (O4)
      description: >
        Upgrade (a higher tier, or monthly → annual): status awaiting_payment, amountUsd is
        the new period's price (IVA incl.), and the payment details are e-mailed. The
        merchant then uploads a receipt (…/proof); platform-admin confirms and the new plan
        starts. Downgrade (a lower tier, or annual → monthly): status scheduled for the next
        charge date; the notifier applies it that day. Owner only. 409 conflict when a
        request is already open (details.reason plan_change_open), or when the target equals
        the current plan. Not available to the demo merchant (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanChangeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangeRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /merchants/{merchantId}/plan-change/{requestId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/RequestId"
    delete:
      tags: [merchants]
      operationId: cancelPlanChange
      summary: Cancel an open request (awaiting_payment, pending_review or scheduled)
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /merchants/{merchantId}/plan-change/{requestId}/proof:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [merchants]
      operationId: submitPlanChangeProof
      summary: Attach the transfer/DEUNA receipt to an upgrade request → pending_review
      description: The receipt is uploaded first via POST /payment-proofs/upload-url.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSubmission" }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangeRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/clients/{merchantId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [admin]
      operationId: getClientDetail
      summary: Platform-admin — the merchant file (verification, subscription, usage, payments, activity)
      responses:
        "200":
          description: Merchant file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/clients/{merchantId}/activate:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: activateClient
      summary: Platform-admin — activate after checking RUC and receipt; e-mails the access details
      description: >
        Both checks must be confirmed (rucVerified and proofVerified true, else 422). Marks
        the signup payment confirmed, sets paymentStatus paid, next charge one period
        ahead, the annual price lock when annual, and e-mails the owner a temporary password
        (D18, same mechanics as resend-credentials). Logged in the activity log. 409 when
        already active. 502 when activation succeeded but the e-mail failed (resend later).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientActivation" }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/EmailDeliveryFailed" }

  /admin/clients/{merchantId}/reject:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: rejectClient
      summary: Platform-admin — reject a signup (or its receipt) with a reason that is e-mailed to the merchant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientRejection" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/EmailDeliveryFailed" }

  /admin/clients/{merchantId}/payments:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: recordClientPayment
      summary: Platform-admin — register a payment received (renewal, overage, other)
      description: >
        Creates a confirmed payment, sets lastPaymentAt, moves nextChargeAt one period ahead
        for renewals (and refreshes the annual price lock), and sets paymentStatus paid.
        Logged in the activity log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRecord" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/clients/{merchantId}/payments/{paymentId}/receipt:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [admin]
      operationId: getClientPaymentReceipt
      summary: Platform-admin — short-lived link to a payment's receipt
      responses:
        "200":
          description: Presigned download target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofLink" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/clients/{merchantId}/payment-reminder:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: sendPaymentReminder
      summary: Platform-admin — e-mail the owner a payment reminder with the amount due and the payment details
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsResent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/EmailDeliveryFailed" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /admin/plan-changes/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [admin]
      operationId: approvePlanChange
      summary: Platform-admin — confirm an upgrade's payment and switch the plan now
      description: >
        Only for status pending_review (or awaiting_payment when paid by other means).
        Confirms the linked payment, applies tier + billing period, and for annual sets the
        price lock and the next charge one year ahead. Logged; the merchant is e-mailed.
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangeRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/plan-changes/{requestId}/reject:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [admin]
      operationId: rejectPlanChange
      summary: Platform-admin — reject an upgrade request with a reason (e-mailed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientRejection" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangeRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/platform-settings:
    get:
      tags: [admin]
      operationId: getPlatformSettings
      summary: Platform-admin — pricing phase and the full payment details (admin form)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updatePlatformSettings
      summary: Platform-admin — switch the pricing phase (launch → list when Apple Wallet ships)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth (GoTrue) access token, validated via JWKS.

  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MerchantIdQuery:
      name: merchantId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationUserId:
      name: operationUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; makes the mutation safe to replay after offline queueing.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (e.g. duplicate or state conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TierLimit:
      description: >
        Plan limit reached (`tier_limit` — operation users) or the feature is not
        in the merchant's plan (`feature_not_in_plan`, details.feature + details.requiredTier).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotConfigured:
      description: A required provider is not configured on this deployment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EmailDeliveryFailed:
      description: The email could not be delivered to the SMTP server (`email_delivery_failed`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Per-window fraud/rate limit hit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine-readable error code }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        version: { type: string }

    Tier:
      type: string
      description: Self-service plans. Enterprise / white-label is quoted off-catalog (D17).
      enum: [starter, growth, pro]

    PlanFeature:
      type: string
      description: >
        campaigns = seasonal + accumulation campaigns (every plan); basic_notifications =
        basic notifications (every plan, within the plan's notification allowance);
        reports = reports + campaign dashboard; user_management = operation users;
        nearby_notifications = "Estás cerca" (every plan since v3.0); manual_campaigns =
        group messages, events, flash offers, links, 48 h result (Growth+);
        automated_campaigns = custom-text reminders and sequences, birthdays, level-up
        notice, yearly repeating campaigns (Pro); branch_reports = reports by branch (Pro);
        staff_roles = the manager role (Pro); data_export = CSV export (Pro).
      enum: [campaigns, basic_notifications, reports, user_management, nearby_notifications, manual_campaigns, automated_campaigns, branch_reports, staff_roles, data_export]

    PricingPhase:
      type: string
      description: >
        launch = launch price charged, list price shown struck through (until Apple Wallet
        ships); list = list price charged. Annual terms keep their locked price until renewal.
      enum: [launch, list]

    BillingPeriod:
      type: string
      description: annual = 20 % less per month, paid up front, price locked until renewal.
      enum: [monthly, annual]

    Plan:
      type: object
      description: Catalog entry (business model v3.0). Plan prices include IVA; per-unit extras are + IVA.
      required: [tier, priceUsd, listPriceUsd, annualPriceUsd, annualListPriceUsd, pricingPhase,
                 includedCards, extraCardUsd, includedNotifications, extraNotificationUsd,
                 locationLimit, features]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        priceUsd: { type: number, description: "Monthly price charged today, IVA included (launch: 5.99 / 17.99 / 57.99)." }
        listPriceUsd: { type: number, description: "Monthly list price, IVA included (7.99 / 22.99 / 74.99). Shown struck through while pricingPhase = launch." }
        annualPriceUsd: { type: number, description: "Annual price charged today, IVA included (launch: 56.99 / 171.99 / 555.99)." }
        annualListPriceUsd: { type: number, description: "Annual list price, IVA included (75.99 / 219.99 / 718.99)." }
        pricingPhase: { $ref: "#/components/schemas/PricingPhase" }
        includedCards: { type: integer, description: Active cards included per month (200 / 1,000 / 5,000). }
        extraCardUsd: { type: number, description: "USD per active card above the inclusion, + IVA." }
        includedNotifications: { type: integer, description: "Notifications included per month (500 / 3,000 / 10,000)." }
        extraNotificationUsd: { type: number, description: "USD per notification above the inclusion, + IVA (0.015 / 0.010 / 0.005)." }
        locationLimit: { type: integer, description: Branches allowed (1 / 3 / 10). }
        operationUserLimit: { type: integer, description: "Absent = unlimited (every plan since v3.0)." }
        features:
          type: array
          items: { $ref: "#/components/schemas/PlanFeature" }
      additionalProperties: false

    PlanUsage:
      type: object
      required: [plan, activeCards, extraCards, extraCardsUsd, notificationsUsed, extraNotifications,
                 extraNotificationsUsd, estimatedTotalUsd, programCount, operationUserCount, periodStart]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        activeCards: { type: integer, description: Cards currently active (billing metric). }
        extraCards: { type: integer, description: max(0, activeCards - plan.includedCards). }
        extraCardsUsd: { type: number }
        notificationsUsed: { type: integer, description: "Wallet notifications delivered with a push this calendar month (UTC) — the billed figure." }
        extraNotifications: { type: integer }
        extraNotificationsUsd: { type: number }
        estimatedTotalUsd: { type: number, description: "subscriptionUsd + both overages + IVA on the overages, rounded to cents." }
        subscriptionUsd: { type: number, description: "Subscription part of this month's charge, IVA included (the locked/annual price in a renewal month, 0 in an annual term's other months)." }
        ivaUsd: { type: number, description: IVA contained in estimatedTotalUsd (subscription + overage). }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        locationCount: { type: integer, description: Active branches (against plan.locationLimit). }
        programCount: { type: integer }
        operationUserCount: { type: integer }
        periodStart: { type: string, format: date, description: First day of the current billing month (UTC). }
      additionalProperties: false

    ProgramType:
      type: string
      description: >
        loyalty_stamps / loyalty_points = accumulation campaigns ("campaña de acumulación":
        collect towards a reward); seasonal_discount = seasonal campaign ("campaña de
        temporada": a discount for a special date, usable once per customer, only while the
        campaign is active); membership_pass = membership (unchanged).
      enum: [loyalty_stamps, loyalty_points, membership_pass, seasonal_discount]

    CampaignStatus:
      type: string
      description: >
        Read-only, computed on every read. disabled = switched off by the merchant (active
        false); upcoming / ended = a seasonal campaign before validFrom / after validUntil
        (Ecuador time); active = otherwise. Only `active` lets a customer enrol, and (for
        seasonal) lets the cashier apply the discount.
      enum: [active, upcoming, ended, disabled]

    RewardMechanic:
      type: string
      enum: [stamps, points]

    MembershipValidity:
      type: string
      enum: [monthly, quarterly, annual, per_event]

    PaymentStatus:
      type: string
      description: >
        pending = signed up, awaiting verification ("Por verificar" when a receipt exists);
        paid = active and up to date; overdue = payment late; suspended = switched off by
        platform-admin; rejected = signup rejected (reason e-mailed, Subscription.rejectionReason).
      enum: [pending, paid, overdue, suspended, rejected]

    StaffRole:
      type: string
      description: >
        Operation-user role. cashier = scans, adds stamps/points, redeems; manager (Pro,
        `staff_roles`) = also sees reports for their branches and manages cashiers there.
      enum: [cashier, manager]

    Role:
      type: string
      enum: [platform_admin, merchant_owner, operation_user, customer]

    Identity:
      type: object
      required: [userId, roles]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        merchantId:
          type: string
          format: uuid
          description: Present for merchant_owner / operation_user.
        station: { type: string, description: Operation-user station label (e.g. Caja 1). }
        name: { type: string, description: Display name for the console menu (profile name, else the e-mail's local part). }
        staffRole: { $ref: "#/components/schemas/StaffRole" }
        businessName: { type: string, description: The merchant's name (owner / operation user). }
        tier: { $ref: "#/components/schemas/Tier" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationRef" }
          description: >-
            Active locales this user may scan at — an operation user's assigned ones, every
            active locale for the owner. Empty when the merchant registered none; the
            cashier screen asks for one only when there are two or more.
        mustChangePassword:
          type: boolean
          description: >-
            True while the user still holds an emailed temporary password; the PWA blocks
            every screen except the change-password page until POST /me/password succeeds.
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 8, maxLength: 72 }
      additionalProperties: false

    CredentialsResent:
      type: object
      required: [sent, email]
      properties:
        sent: { type: boolean }
        email: { type: string, format: email, description: Address the credentials were sent to. }
      additionalProperties: false

    MerchantOnboardRequest:
      type: object
      required: [businessName, ruc, category, city, contactName, contactEmail, tier, payment]
      properties:
        businessName: { type: string }
        ruc: { type: string, description: Ecuador tax id }
        category:
          type: string
          description: "The signup offers cafe_restaurant, beauty (barbería o belleza), retail (tienda) and other; gym and events remain valid for older rows."
          enum: [cafe_restaurant, beauty, gym, retail, events, other]
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, maxLength: 20, description: "WhatsApp, optional." }
        tier: { $ref: "#/components/schemas/Tier" }
        billingPeriod:
          $ref: "#/components/schemas/BillingPeriod"
          description: Omitted = monthly (handler fallback; no OpenAPI default, see `language`).
        payment: { $ref: "#/components/schemas/PaymentSubmission" }
        language:
          type: string
          enum: [es, en]
          description: >-
            UI language at signup; the credentials email is written in it (also reused by
            admin resend). Omitted means Spanish. No OpenAPI `default` on purpose (codegen
            would emit a bare string, not the enum member); the handler falls back.
      additionalProperties: false

    PaymentSubmission:
      description: Stubbed payment. For now only manual proof is stored.
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [card, deuna, manual_transfer] }
        proofStorageKey:
          type: string
          description: >
            Private-bucket key of the uploaded receipt, from
            POST /payment-proofs/upload-url. REQUIRED for `deuna` / `manual_transfer`.
      additionalProperties: false

    PaymentSettings:
      description: >
        Platform-level transfer/DEUNA account the subscribing merchant pays into.
        Single record, maintained by platform-admin (Función 04) and read publicly by
        the signup page (Función 02).
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >
            False until platform-admin fills in an account number — the signup page
            then tells the visitor to contact conpass instead of transferring blind.
        bankName: { type: string, description: "e.g. Banco Pichincha" }
        accountType: { type: string, enum: [savings, checking] }
        accountNumber: { type: string }
        beneficiaryName: { type: string, description: Account holder shown to the payer. }
        beneficiaryTaxId: { type: string, description: "Beneficiary RUC / cédula" }
        contactEmail: { type: string, description: Where payers may also send the receipt. }
        instructions: { type: string, description: Free-text note rendered under the details. }
        qrImageUrl:
          type: string
          description: Public HTTPS URL of the DEUNA QR image (null until one is uploaded).
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentSettingsUpdate:
      description: >
        Partial update. Every field is optional; an explicit empty string clears it.
        `qrStorageKey` comes from POST /admin/payment-settings/qr-upload-url.
      type: object
      properties:
        bankName: { type: string }
        accountType: { type: string, enum: [savings, checking] }
        accountNumber: { type: string }
        beneficiaryName: { type: string }
        beneficiaryTaxId: { type: string }
        contactEmail: { type: string }
        instructions: { type: string }
        qrStorageKey: { type: string }
      additionalProperties: false

    PaymentProofUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg, application/pdf] }
      additionalProperties: false

    PaymentProofUploadResult:
      type: object
      required: [uploadUrl, storageKey]
      properties:
        uploadUrl: { type: string, description: Short-lived presigned S3 PUT URL. }
        storageKey: { type: string, description: Submit as payment.proofStorageKey. }
      additionalProperties: false

    PaymentProofLink:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Short-lived presigned S3 GET URL. }
        uploadedAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentQrUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg] }
      additionalProperties: false

    MerchantOnboardResult:
      type: object
      required: [merchant, subscription, ownerInviteSent, ownerEmail]
      properties:
        merchant: { $ref: "#/components/schemas/Merchant" }
        subscription: { $ref: "#/components/schemas/Subscription" }
        ownerInviteSent:
          type: boolean
          description: >-
            True when the temporary-password email was handed to the SMTP server. False means
            the account exists but the email failed; platform-admin can resend credentials.
        ownerEmail: { type: string, format: email, description: Login email for the owner account. }
      additionalProperties: false

    Merchant:
      type: object
      required: [id, businessName, city, category, createdAt]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        ruc: { type: string }
        category: { type: string }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        logoStorageKey: { type: string }
        subscription: { $ref: "#/components/schemas/Subscription" }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Subscription:
      type: object
      required: [tier, paymentStatus, billingPeriod, priceUsd, listPriceUsd, priceLocked, includedCards, includedNotifications, locationLimit]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        priceUsd: { type: number, description: "What this subscription costs per billing period, IVA included — the locked price for an annual term, else the catalog price for the current phase." }
        listPriceUsd: { type: number, description: List price for the same period (struck through while it differs from priceUsd). }
        priceLocked: { type: boolean, description: True for an annual term whose price is fixed until nextChargeAt (renewal). }
        includedCards: { type: integer, description: Active cards included — NOT a cap; extra cards are billed. }
        includedNotifications: { type: integer }
        locationLimit: { type: integer }
        activeCards: { type: integer, description: "Billing metric — active, not paused, saved to a wallet; discount cards excluded (v3.0 §4)." }
        operationUserLimit: { type: integer, description: Absent = unlimited. }
        nextChargeAt: { type: string, format: date }
        lastPaymentAt: { type: string, format: date }
        rejectionReason: { type: string, description: Present when paymentStatus = rejected. }
        pendingChange: { $ref: "#/components/schemas/PlanChangeRequest" }
      additionalProperties: false

    SubscriptionUpdate:
      type: object
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
      additionalProperties: false

    OperationUser:
      type: object
      required: [id, name, email, station, locationIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        staffRole: { $ref: "#/components/schemas/StaffRole" }
        lastSignInAt: { type: string, format: date-time, description: "Last sign-in (Supabase Auth); absent = never signed in." }
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (empty = none assigned).
        tempPassword:
          type: string
          description: Temporary password, returned only when the operator is first created.
      additionalProperties: false

    OperationUserCreate:
      type: object
      required: [name, email, station]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        staffRole:
          $ref: "#/components/schemas/StaffRole"
          description: "manager needs `staff_roles` (Pro) → 402. Omitted on create = cashier."
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (owner decision, Phase 16). Replaces the set when sent.
      additionalProperties: false

    OperationUserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        staffRole:
          $ref: "#/components/schemas/StaffRole"
          description: "manager needs `staff_roles` (Pro) → 402. Omitted on create = cashier."
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (owner decision, Phase 16). Replaces the set when sent.
      additionalProperties: false

    OperationUserPasswordReset:
      type: object
      required: [id, tempPassword]
      properties:
        id: { type: string, format: uuid }
        tempPassword: { type: string, description: Newly issued temporary password. }
      additionalProperties: false

    ProgramAppearance:
      type: object
      description: >
        Card look. `color` is the pass background colour and is always meaningful: Google
        Wallet does NOT derive a background from the hero image (it falls back to its own
        default), so a merchant that wants a specific colour must set one even when an
        image is used. `backgroundStorageKey` is the hero image drawn ON that colour — the
        two combine rather than compete, and a transparent PNG lets the colour show
        through. Empty string clears a field (writes NULL); omitting a field on PATCH
        leaves it unchanged. The icon is independent of both.
      properties:
        color: { type: string, description: "Hex background colour of the pass. Empty string clears it. Combines with backgroundStorageKey." }
        iconStorageKey: { type: string, description: "Pass logo. PNG, 660x660 minimum, 1:1 (Google Wallet logo spec). Empty string clears it." }
        backgroundStorageKey: { type: string, description: "Pass hero image, drawn over the background colour. PNG recommended (a transparent PNG lets the colour show through), 1032x812, ~5:4 — near-square, no embedded text, 20dp breathing room top and bottom (Google Wallet hero-image spec). JPEG accepted. Empty string clears it." }
        iconUrl: { type: string, description: Public URL for the icon (read-only). }
        backgroundUrl: { type: string, description: Public URL for the background (read-only). }
      additionalProperties: false

    AppearanceUploadRequest:
      type: object
      required: [kind, contentType]
      properties:
        kind: { type: string, enum: [icon, background] }
        contentType: { type: string, enum: [image/png, image/jpeg] }
      additionalProperties: false

    AppearanceUploadResult:
      type: object
      required: [uploadUrl, storageKey, publicUrl]
      properties:
        uploadUrl: { type: string, description: Presigned S3 PUT URL (short-lived). }
        storageKey: { type: string, description: S3 key to persist via PATCH /programs appearance. }
        publicUrl: { type: string, description: Public HTTPS URL for the uploaded asset. }
      additionalProperties: false

    ProgramCreate:
      type: object
      required: [type, name, appearance, wallets]
      properties:
        type: { $ref: "#/components/schemas/ProgramType" }
        name: { type: string }
        mechanic: { $ref: "#/components/schemas/RewardMechanic" }
        stampsForReward: { type: integer, minimum: 1 }
        pointsForReward: { type: integer, minimum: 1 }
        pointsPerDollar: { type: number, minimum: 0 }
        reward: { type: string, description: Reward description shown on the card. }
        membershipValidity: { $ref: "#/components/schemas/MembershipValidity" }
        membershipIncludes: { type: string }
        welcomeBonus: { type: integer, default: 0 }
        expiryDays: { type: integer, description: Balance expiry window; null = no expiry. }
        occasion: { type: string, description: "seasonal_discount: the special date it celebrates, e.g. \"Día de la Madre\"." }
        discountPercent: { type: integer, minimum: 1, maximum: 100, description: "seasonal_discount: the discount. At least one of discountPercent / reward is required; reward is the free-text offer (\"2x1 en postres\")." }
        validFrom: { type: string, format: date, description: "seasonal_discount (required): first day the campaign is active, inclusive, Ecuador time." }
        validUntil: { type: string, format: date, description: "seasonal_discount (required): last day the campaign is active, inclusive, Ecuador time. Must be >= validFrom." }
        inactivityDays:
          type: integer
          minimum: 1
          maximum: 3650
          deprecated: true
          description: >
            DEPRECATED (Phase 18, O2): ignored on write. Inactivity is fixed at 90 days for
            every merchant (cards pause after 90 days without use, keep their balance and
            reactivate on scan); reads always return 90 for accumulation campaigns.
        appearance: { $ref: "#/components/schemas/ProgramAppearance" }
        wallets:
          type: array
          items: { type: string, enum: [apple, google] }
          minItems: 1
      additionalProperties: false

    ProgramUpdate:
      type: object
      properties:
        name: { type: string }
        reward: { type: string }
        stampsForReward: { type: integer, minimum: 1 }
        pointsForReward: { type: integer, minimum: 1 }
        pointsPerDollar: { type: number, minimum: 0 }
        inactivityDays: { type: integer, minimum: 1, maximum: 3650, description: See ProgramCreate.inactivityDays. }
        occasion: { type: string, description: "seasonal_discount only. Empty string clears it." }
        discountPercent: { type: integer, minimum: 1, maximum: 100, description: seasonal_discount only. }
        validFrom: { type: string, format: date, description: seasonal_discount only. }
        validUntil: { type: string, format: date, description: "seasonal_discount only. The merged row must still satisfy the ProgramCreate rules (dates present, validUntil >= validFrom, an offer)." }
        appearance: { $ref: "#/components/schemas/ProgramAppearance" }
        active: { type: boolean }
      additionalProperties: false

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramCreate"
        - type: object
          required: [id, merchantId, active, createdAt]
          properties:
            id: { type: string, format: uuid }
            merchantId: { type: string, format: uuid }
            active: { type: boolean }
            campaignStatus: { $ref: "#/components/schemas/CampaignStatus" }
            enrollmentUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
            demoPinned:
              type: boolean
              description: >-
                Public demo only: a fixed campaign that every visitor sees. It cannot be
                edited or deactivated (PATCH and appearance upload answer 403 with
                details.reason demo_pinned) and is never purged. False or omitted
                outside the demo.
            demoExpiresAt:
              type: string
              format: date-time
              description: >-
                Public demo only: when this visitor-created campaign is deleted (30
                minutes after createdAt), together with its cards. Omitted for pinned
                campaigns and outside the demo.

    EnrollmentRequest:
      description: Minimal PII by design; all personal fields optional.
      type: object
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: WhatsApp number. }
        birthday: { type: string, format: date }
        accessCode: { type: string, description: Required for exclusive/membership programs. }
        consent: { type: boolean, description: Consent to WhatsApp/email comms. }
        dedupeKey:
          type: string
          description: Optional client key to dedupe repeat submissions from the same device.
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the customer signed up at (enrol link `?local=<id>`). Ignored when it is
            not an active locale of the program's merchant — never fails the enrolment.
        language:
          type: string
          enum: [es, en]
          description: >-
            UI language the customer had selected when submitting the form; drives the
            labels on their wallet pass. Omitted means Spanish. Deliberately carries no
            OpenAPI `default`: datamodel-codegen emits one as a bare string rather than
            an enum member, so every request model would fail its own enum on
            serialization. The fallback lives in the handler instead.
      additionalProperties: false

    Card:
      type: object
      required: [id, programId, merchantId, type, balance, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ProgramType" }
        opaqueToken: { type: string, description: Opaque per-member id encoded in the QR. }
        balance: { $ref: "#/components/schemas/Balance" }
        holderName: { type: string, description: Display name (e.g. "María T."). }
        language: { type: string, enum: [es, en] }
        active: { type: boolean }
        walletInstalled: { type: boolean, description: "Google reports the pass saved by at least one user. Never-saved cards are neither billed nor notified (v3.0 §4)." }
        paused: { type: boolean, description: "Paused after 90 days without use — not billed nor notified; keeps its balance; the next scan reactivates it (O2)." }
        level: { type: integer, minimum: 1, description: "Accumulation campaigns: 1 + redemptions; never drops (v3.0 decision 12)." }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Balance:
      description: >
        Backend-authoritative. Wallet is display-only. For seasonal_discount, a card is
        issued with rewardsAvailable 1; applying the discount moves it to rewardsRedeemed
        (so rewardsRedeemed >= 1 means "used"). `mechanic` carries no meaning for
        membership_pass / seasonal_discount.
      type: object
      required: [mechanic]
      properties:
        mechanic: { $ref: "#/components/schemas/RewardMechanic" }
        stamps: { type: integer, minimum: 0 }
        stampsForReward: { type: integer }
        points: { type: integer, minimum: 0 }
        pointsForReward: { type: integer }
        rewardsAvailable: { type: integer, minimum: 0, description: Rewards earned and not yet claimed. }
        rewardsRedeemed: { type: integer, minimum: 0, description: Rewards already claimed — never decreases. }
        membershipActiveUntil: { type: string, format: date }
      additionalProperties: false

    WalletLinks:
      type: object
      properties:
        google: { type: string, format: uri, description: Add to Google Wallet (signed JWT save link). }
        apple: { type: string, format: uri, description: Add to Apple Wallet (.pkpass) — future. }
      additionalProperties: false

    CardIssued:
      type: object
      required: [card, walletLinks]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        walletLinks: { $ref: "#/components/schemas/WalletLinks" }
      additionalProperties: false

    ScanResolveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Scanned opaque token or manually-entered code. }
      additionalProperties: false

    CardResolution:
      type: object
      required: [card, program]
      description: Resolving a paused card reactivates it (the scan counts as use — O2).
      properties:
        card: { $ref: "#/components/schemas/Card" }
        program: { $ref: "#/components/schemas/Program" }
        birthdayReward: { $ref: "#/components/schemas/BirthdayReward" }
      additionalProperties: false

    AccrueRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid, description: "Ignored since Phase 18: the operation is recorded under the authenticated caller (kept required for older clients)." }
        stamps: { type: integer, minimum: 1, description: Stamps to add (stamps mechanic). }
        amount: { type: number, minimum: 0, description: Purchase amount → points (points mechanic). }
        occurredAt:
          type: string
          format: date-time
          description: Client timestamp of the in-store event (for offline replay ordering).
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the scan happens at. Must be an active locale of the card's merchant and,
            for an operation user, one assigned to them (else 422). Optional — omitted when
            the merchant has no locales.
      additionalProperties: false

    RedeemRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid, description: "Ignored since Phase 18: the operation is recorded under the authenticated caller (kept required for older clients)." }
        occurredAt: { type: string, format: date-time }
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the scan happens at. Must be an active locale of the card's merchant and,
            for an operation user, one assigned to them (else 422). Optional — omitted when
            the merchant has no locales.
        birthdayRewardId:
          type: string
          format: uuid
          description: >-
            Redeem this birthday reward (CardResolution.birthdayReward) instead of the
            campaign reward — transaction kind birthday_redeem. 422 when it is not this
            card's, already redeemed, or past validUntil.
      additionalProperties: false

    ValidateAccessRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid, description: "Ignored since Phase 18: the operation is recorded under the authenticated caller (kept required for older clients)." }
        occurredAt: { type: string, format: date-time }
      additionalProperties: false

    OperationResult:
      type: object
      required: [card, transaction]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        transaction: { $ref: "#/components/schemas/Transaction" }
        walletUpdateQueued: { type: boolean }
      additionalProperties: false

    Transaction:
      type: object
      required: [id, cardId, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        kind: { type: string, enum: [accrue_stamps, accrue_points, redeem, validate_access, birthday_issue, birthday_redeem, reversal] }
        stampsDelta: { type: integer }
        pointsDelta: { type: integer }
        operationUserId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        reversesId: { type: string, format: uuid, description: "kind = reversal: the operation it undoes." }
        reversedAt: { type: string, format: date-time, description: Set on an operation that was undone. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    AccessDecision:
      type: object
      required: [cardId, granted]
      properties:
        cardId: { type: string, format: uuid }
        granted: { type: boolean }
        reason: { type: string }
        validUntil: { type: string, format: date }
      additionalProperties: false

    Redemption:
      type: object
      required: [id, customerName, programId, reward, redeemedAt]
      properties:
        id: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: string, format: email }
        programId: { type: string, format: uuid }
        program: { type: string }
        reward: { type: string }
        redeemedAt: { type: string, format: date-time }
      additionalProperties: false

    ProgramMetrics:
      type: object
      properties:
        secondVisitRate30d: { type: number, description: "% of new customers returning within 30d (definition: SecondVisit)." }
        secondVisitNew: { type: integer, description: Customers who enrolled in the last 30 days (the rate's denominator). }
        secondVisitReturned: { type: integer, description: Of those, how many came back (the numerator). }
        redemptions30d: { type: integer, description: Redemptions in the last 30 days. }
        levelDistribution:
          type: array
          items: { $ref: "#/components/schemas/LevelCount" }
          description: Exact count of active cards at each level, ascending (accumulation campaigns only).
        activeInstalledPasses: { type: integer }
        installsThisWeek: { type: integer }
        visits: { type: integer }
        redemptions: { type: integer }
        churnRate:
          type: number
          description: >
            Abandonment rate ("tasa de abandono"): % of active cards with no activity in the
            last `inactivityDays` days (last accrual/redemption, or enrolment if none).
            Accumulation campaigns only — omitted for membership_pass.
        inactivityDays: { type: integer, description: "The N used for churnRate (the program's setting, 90 when unset). Omitted for membership_pass." }
        eligibleForReminder: { type: integer, description: Customers 1 stamp/step from reward. }
      additionalProperties: false

    BirthdayAutomation:
      type: object
      required: [enabled, benefitType]
      properties:
        enabled: { type: boolean }
        benefitType: { type: string, enum: [discount, gift] }
        discountPercent: { type: integer, minimum: 1, maximum: 100 }
        gift: { type: string }
        validityDays: { type: integer, minimum: 1 }
      additionalProperties: false

    BirthdayCardCreate:
      type: object
      required: [programId, customerId]
      properties:
        programId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
      additionalProperties: false

    BirthdayCard:
      type: object
      required: [id, code, customerName, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: Unique irreproducible code (e.g. CUMPLE-3F9A). }
        customerName: { type: string }
        benefit: { type: string }
        validUntil: { type: string, format: date }
        status: { type: string, enum: [pending, issued, redeemed, expired] }
        walletLinks: { $ref: "#/components/schemas/WalletLinks" }
      additionalProperties: false

    AdminClient:
      type: object
      required: [merchantId, name, city, tier, paymentStatus, priceUsd, activeCards, includedCards, estimatedMonthlyUsd]
      properties:
        merchantId: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        priceUsd: { type: number, description: Plan subscription price. }
        activeCards: { type: integer }
        includedCards: { type: integer }
        estimatedMonthlyUsd: { type: number, description: Subscription + card overage + notification overage. }
        since: { type: string, format: date }
        nextChargeAt: { type: string, format: date }
        lastPaymentAt: { type: string, format: date }
        hasPaymentProof:
          type: boolean
          description: >
            True when the client uploaded a manual-transfer receipt at signup — the admin
            can then open it via GET /admin/clients/{merchantId}/payment-proof.
        paymentProofUploadedAt: { type: string, format: date-time }
        ruc: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        notificationsUsed: { type: integer, description: Notifications billed this month. }
        locationCount: { type: integer, description: Active branches. }
        pendingVerification: { type: boolean, description: "\"Por verificar\": paymentStatus pending and a receipt uploaded." }
        hasPendingPlanChange: { type: boolean, description: An upgrade request is waiting for review. }
      additionalProperties: false

    AdminClientDetail:
      type: object
      description: The platform's merchant file (board 18).
      required: [client, merchant, subscription, usage, payments, activity]
      properties:
        client: { $ref: "#/components/schemas/AdminClient" }
        merchant: { $ref: "#/components/schemas/Merchant" }
        subscription: { $ref: "#/components/schemas/Subscription" }
        usage: { $ref: "#/components/schemas/PlanUsage" }
        ownerEmail: { type: string, format: email, description: The owner's login e-mail. }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        planChange: { $ref: "#/components/schemas/PlanChangeRequest" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEntry" }
          description: Newest first, at most 50.
      additionalProperties: false

    ActivityEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: >
            Stable code, rendered by the PWA: signed_up, proof_uploaded, activated, rejected,
            payment_recorded, reminder_sent, plan_change_requested, plan_changed,
            plan_change_rejected, suspended, reactivated, credentials_resent, location_added.
        actorRole: { type: string, enum: [platform_admin, merchant_owner, operation_user, system] }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    ClientActivation:
      type: object
      required: [rucVerified, proofVerified]
      properties:
        rucVerified: { type: boolean, description: Admin confirmed the RUC is active with the declared activity (SRI). Must be true. }
        proofVerified: { type: boolean, description: Admin confirmed the receipt matches the chosen plan. Must be true. }
      additionalProperties: false

    ClientRejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: Sent to the merchant by e-mail. }
      additionalProperties: false

    Payment:
      type: object
      required: [id, kind, amountUsd, method, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [signup, renewal, plan_change, overage, other] }
        tier: { $ref: "#/components/schemas/Tier" }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        amountUsd: { type: number, description: IVA included. }
        method: { type: string, enum: [manual_transfer, deuna, card, cash, other] }
        status: { type: string, enum: [pending, confirmed, rejected] }
        hasReceipt: { type: boolean }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        paidAt: { type: string, format: date }
        note: { type: string }
        rejectionReason: { type: string }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentRecord:
      type: object
      required: [kind, amountUsd, method, paidAt]
      properties:
        kind: { type: string, enum: [renewal, overage, other] }
        amountUsd: { type: number, minimum: 0 }
        method: { type: string, enum: [manual_transfer, deuna, card, cash, other] }
        paidAt: { type: string, format: date }
        periodStart: { type: string, format: date }
        note: { type: string, maxLength: 500 }
      additionalProperties: false

    PlanChangeCreate:
      type: object
      required: [tier, billingPeriod]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        billingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
      additionalProperties: false

    PlanChangeRequest:
      type: object
      required: [id, fromTier, toTier, fromPeriod, toPeriod, direction, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromTier: { $ref: "#/components/schemas/Tier" }
        toTier: { $ref: "#/components/schemas/Tier" }
        fromPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        toPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        direction: { type: string, enum: [upgrade, downgrade] }
        status: { type: string, enum: [awaiting_payment, pending_review, scheduled, applied, cancelled, rejected] }
        amountUsd: { type: number, description: "Upgrade: what to transfer (the new period's price, IVA incl.)." }
        effectiveAt: { type: string, format: date, description: "Downgrade: the date it applies (next charge)." }
        hasReceipt: { type: boolean }
        rejectionReason: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
      additionalProperties: false

    PlatformSettings:
      type: object
      required: [pricingPhase, paymentSettings]
      properties:
        pricingPhase: { $ref: "#/components/schemas/PricingPhase" }
        listPriceEffectiveAt: { type: string, format: date, description: Announced switch date (30 days' notice). }
        paymentSettings: { $ref: "#/components/schemas/PaymentSettings" }
      additionalProperties: false

    PlatformSettingsUpdate:
      type: object
      properties:
        pricingPhase: { $ref: "#/components/schemas/PricingPhase" }
        listPriceEffectiveAt: { type: [string, "null"], format: date }
      additionalProperties: false

    PlatformStats:
      type: object
      required: [activeClients, mrrUsd, subscriptionMrrUsd, tierCounts]
      properties:
        activeClients: { type: integer }
        mrrUsd: { type: number, description: Sum of estimatedMonthlyUsd over PAID clients (subscription + overage). }
        subscriptionMrrUsd: { type: number, description: Subscription part only, paid clients. }
        tierCounts:
          type: object
          required: [starter, growth, pro]
          properties:
            starter: { type: integer }
            growth: { type: integer }
            pro: { type: integer }
          additionalProperties: false
        overdueCount: { type: integer }
        pendingVerificationCount: { type: integer, description: "\"Por verificar\" (pending with a receipt) — also the sidebar badge." }
        pendingPlanChangeCount: { type: integer }
        suspendedCount: { type: integer }
      additionalProperties: false

    LocationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      additionalProperties: false

    Location:
      type: object
      required: [id, name, latitude, longitude, active, enrollmentQuery, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean, description: Only active locales are scannable and sent to the wallet. }
        enrollmentQuery:
          type: string
          description: Query string to append to any enrol link so sign-ups are attributed here (e.g. "local=<id>").
        operationUserCount: { type: integer, description: Cashiers assigned to this locale. }
        enrolledClients: { type: integer, description: Cards whose customer signed up here. }
        visits30d: { type: integer, description: Effective accruals scanned here in the last 30 days. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    LocationCreate:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90, description: "Decimal degrees, negative south (e.g. -0.18065)." }
        longitude: { type: number, minimum: -180, maximum: 180, description: "Decimal degrees, negative west (e.g. -78.48443)." }
        active: { type: boolean, description: Defaults to true. }
      additionalProperties: false

    LocationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean }
      additionalProperties: false

    ToggleAutomation:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
      additionalProperties: false

    NearAutomation:
      type: object
      required: [enabled, stamps, points]
      description: >-
        «Meta próxima» — one general threshold for all stamps campaigns and one for all
        points campaigns. Fires once when a visit brings the card within the threshold.
      properties:
        enabled: { type: boolean }
        stamps: { type: integer, minimum: 1, maximum: 4, description: Notify when this many stamps or fewer are missing. }
        points: { type: integer, minimum: 5, maximum: 50, multipleOf: 5, description: Notify when this many points or fewer are missing. }
      additionalProperties: false

    MilestoneAutomation:
      type: object
      required: [enabled, every]
      properties:
        enabled: { type: boolean }
        every: { type: integer, minimum: 5, maximum: 50, multipleOf: 5, description: Every N visits (accruals) on a card. }
      additionalProperties: false

    ExpiryAutomation:
      type: object
      required: [enabled, warnDays]
      description: Warns before balanceExpiryDays without a visit zeroes the balance. Inert while balanceExpiryDays is null.
      properties:
        enabled: { type: boolean }
        warnDays: { type: integer, minimum: 1, maximum: 30, description: Days before expiry. }
      additionalProperties: false

    InactiveAutomation:
      type: object
      required: [enabled, days]
      description: >-
        "Te extrañamos" — the basic reminder, every plan since v3.0 (decision 5). Fixed text
        unless the merchant is Pro and set customTexts.inactive. Sent once per absence at
        `days` without a visit. Suppressed while the Pro sequence is on.
      properties:
        enabled: { type: boolean }
        days: { type: integer, minimum: 7, maximum: 89, description: "Days without a visit (before the 90-day pause)." }
      additionalProperties: false

    SequenceStep:
      type: object
      required: [day, text]
      properties:
        day: { type: integer, minimum: 7, maximum: 89, description: Days without a visit. }
        text: { type: string, maxLength: 150, description: The merchant's own text (required, non-blank, while the sequence is enabled). }
      additionalProperties: false

    SequenceAutomation:
      type: object
      required: [enabled, steps]
      description: >-
        Pro (automated_campaigns): up to 3 reminders by days without a visit, each with its
        own text; days strictly ascending. Stops as soon as the customer comes back. While
        enabled it replaces the single "Te extrañamos" reminder.
      properties:
        enabled: { type: boolean }
        steps:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SequenceStep" }
      additionalProperties: false

    BirthdayAutomationSettings:
      type: object
      required: [enabled, benefit, validityDays]
      description: >-
        Pro (automated_campaigns): on the customer's birthday at 09:00 Ecuador time, a
        birthday reward is attached to their most recently used active loyalty card and the
        notice is sent. Redeemed at the till like a reward (RedeemRequest.birthdayRewardId),
        valid `validityDays` days. Only customers who left their date (optional, asked after
        saving the card) receive it.
      properties:
        enabled: { type: boolean }
        benefit: { type: string, enum: [gift, discount] }
        gift: { type: string, maxLength: 80, description: "benefit = gift: e.g. \"Un postre de la casa\". Required then." }
        discountPercent: { type: integer, minimum: 1, maximum: 100, description: "benefit = discount: required then." }
        validityDays: { type: integer, minimum: 1, maximum: 30 }
      additionalProperties: false

    CustomTexts:
      type: object
      description: >-
        Pro (automated_campaigns): the merchant's own wording; omitted or empty = the fixed
        template. Sending any non-empty text without Pro → 402. Placeholders: {negocio},
        {premio}, {faltan}, {nivel}.
      properties:
        ready: { type: string, maxLength: 150 }
        near: { type: string, maxLength: 150 }
        inactive: { type: string, maxLength: 150 }
        levelUp: { type: string, maxLength: 150 }
        birthday: { type: string, maxLength: 150 }
      additionalProperties: false

    AutomationStat:
      type: object
      required: [sent, visits48h]
      properties:
        sent: { type: integer, description: Delivered in the last 30 days. }
        visits48h: { type: integer, description: Of those, came back within 48 h. }
      additionalProperties: false

    NotificationAutomations:
      type: object
      required: [balance, ready, near, inactive, sequence, levelUp, birthday]
      properties:
        balance: { $ref: "#/components/schemas/ToggleAutomation" }
        ready: { $ref: "#/components/schemas/ToggleAutomation" }
        near: { $ref: "#/components/schemas/NearAutomation" }
        inactive: { $ref: "#/components/schemas/InactiveAutomation" }
        sequence: { $ref: "#/components/schemas/SequenceAutomation" }
        levelUp:
          $ref: "#/components/schemas/ToggleAutomation"
          description: "\"Subiste de nivel\" on each redemption — Pro (automated_campaigns)."
        birthday: { $ref: "#/components/schemas/BirthdayAutomationSettings" }
        milestone:
          $ref: "#/components/schemas/MilestoneAutomation"
          description: DEPRECATED (Phase 18) — not part of the v3.0 set; ignored on write, always disabled on read.
        expiry:
          $ref: "#/components/schemas/ExpiryAutomation"
          description: DEPRECATED (Phase 18, O2) — balances no longer expire; ignored on write, always disabled on read.
      additionalProperties: false

    CardLocationSettings:
      type: object
      required: [enrolled, topVisited]
      description: Per-card (object) wallet locations, on top of the program's locales. At most 10 per card. Every plan since v3.0 (nearby_notifications is in every plan).
      properties:
        enrolled: { type: boolean, description: Add the locale where the customer signed up. }
        topVisited: { type: boolean, description: Add the locales the customer visited most (cashier scans). }
      additionalProperties: false

    NotificationSettingsUpdate:
      type: object
      required: [automations, cardLocations]
      description: >-
        Full replace. Pro-only parts (sequence / levelUp / birthday enabled, any custom
        text) → 402 feature_not_in_plan without automated_campaigns.
      properties:
        automations: { $ref: "#/components/schemas/NotificationAutomations" }
        customTexts: { $ref: "#/components/schemas/CustomTexts" }
        balanceExpiryDays:
          type: [integer, "null"]
          deprecated: true
          description: DEPRECATED (Phase 18, O2) — ignored; balances never expire.
        cardLocations: { $ref: "#/components/schemas/CardLocationSettings" }
      additionalProperties: false

    NotificationSettings:
      type: object
      required: [automations, customTexts, cardLocations, platformRules, automationStats, birthdaysOnFile]
      properties:
        automations: { $ref: "#/components/schemas/NotificationAutomations" }
        customTexts: { $ref: "#/components/schemas/CustomTexts" }
        balanceExpiryDays: { type: [integer, "null"], deprecated: true, description: Always null (O2). }
        cardLocations: { $ref: "#/components/schemas/CardLocationSettings" }
        platformRules: { $ref: "#/components/schemas/PlatformNotificationRules" }
        automationStats:
          type: object
          description: Last-30-days result per automation type (keys ready, near, inactive, sequence, levelUp, birthday, balance); missing key = nothing sent.
          additionalProperties: { $ref: "#/components/schemas/AutomationStat" }
        birthdaysOnFile: { type: integer, description: Customers who left their birthday. }
      additionalProperties: false

    PlatformNotificationRules:
      type: object
      required: [capPerDay, quietHoursEnabled, quietStart, quietEnd, timezone]
      properties:
        capPerDay: { type: integer, minimum: 1, maximum: 3, description: Max notifications per card per rolling 24 h. Google allows 3. }
        quietHoursEnabled: { type: boolean, description: When on, nothing is pushed between quietStart and quietEnd; it goes out at quietEnd. }
        quietStart: { type: string, description: "Fixed \"21:00\"." }
        quietEnd: { type: string, description: "Fixed \"08:00\"." }
        timezone: { type: string, description: "Fixed \"America/Guayaquil\"." }
      additionalProperties: false

    PlatformNotificationRulesUpdate:
      type: object
      properties:
        capPerDay: { type: integer, minimum: 1, maximum: 3 }
        quietHoursEnabled: { type: boolean }
      additionalProperties: false

    AudienceCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }
        levelMin: { type: integer, description: For level counts. }
        locationId: { type: string, format: uuid, description: For locale counts. }
        name: { type: string, description: Locale name, for locale counts. }
      additionalProperties: false

    NotificationAudiences:
      type: object
      required: [all, near, inactive, levels, locations]
      properties:
        all: { type: integer, description: Every notifiable card — also "Tarjetas que reciben". }
        near: { type: integer, description: Within the merchant's near-goal thresholds. }
        inactive: { type: integer, description: No visit in 30 days. }
        levels:
          type: array
          items: { $ref: "#/components/schemas/AudienceCount" }
          description: Cards at level >= levelMin, for levelMin 2..10.
        locations:
          type: array
          items: { $ref: "#/components/schemas/AudienceCount" }
          description: One entry per active locale — customers who signed up or scanned there.
      additionalProperties: false

    NotificationCreate:
      type: object
      required: [type, audience, body]
      properties:
        type: { type: string, enum: [general, event, flash], description: "general = Aviso general (every plan); event, flash = Growth+." }
        audience: { type: string, enum: [all, near, inactive, level, location], description: Anything but all = Growth+. }
        levelMin: { type: integer, minimum: 2, maximum: 50, description: Required when audience = level. }
        locationId: { type: string, format: uuid, description: Required when audience = location. }
        title: { type: string, maxLength: 60, description: Message header; defaults to the business name. }
        body: { type: string, minLength: 1, maxLength: 150 }
        url: { type: string, maxLength: 500, pattern: "^https://", description: Optional "more information" link (Growth+); must relate to the program. }
        eventAt: { type: string, format: date-time, description: Required when type = event. The message hides from the pass 6 h after it. }
        flashHours: { type: integer, minimum: 1, maximum: 72, description: Required when type = flash. The message hides from the pass when the offer closes. }
        scheduledAt: { type: string, format: date-time, description: Omit to send now; otherwise a future instant (max 60 days ahead). }
      additionalProperties: false

    Notification:
      type: object
      required: [id, source, type, audience, body, status, recipients, delivered, visits48h, createdAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [manual, automation] }
        type: { type: string, enum: [general, event, flash, balance, ready, near, milestone, expiry, inactive, sequence, level_up, birthday] }
        audience: { type: string, enum: [all, near, inactive, level, location, automatic] }
        levelMin: { type: integer }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        title: { type: string }
        body: { type: string, description: For automations, a sample of the day's message (texts are personalised per card). }
        url: { type: string }
        eventAt: { type: string, format: date-time }
        flashHours: { type: integer }
        status: { type: string, enum: [scheduled, queued, sent, cancelled] }
        scheduledAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        day: { type: string, format: date, description: Automations — the Ecuador day this batch covers. }
        recipients: { type: integer, description: Cards targeted. }
        delivered: { type: integer, description: Cards the wallet accepted the message for. }
        visits48h: { type: integer, description: Recipients with a visit or redemption within 48 h of their delivery. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    DemoContext:
      type: object
      required: [merchantId, businessName, programId, ownerEmail, ownerPassword]
      properties:
        merchantId: { type: string, format: uuid }
        businessName: { type: string }
        programId: { type: string, format: uuid, description: "The demo's fixed (pinned) stamps campaign — the public enroll journey targets it. Falls back to any pinned campaign, then the latest active one." }
        ownerEmail: { type: string, format: email }
        ownerPassword: { type: string, description: "Shared demo password — intentionally public (sandbox account, demo-only data)." }
        sampleCardCode:
          type: string
          description: >
            Opaque code of the seeded demo customer's active card (preferring the one in
            `programId`, else their most recent in any demo program), so the demo cashier
            can be pre-filled. Demo-only data; omitted when no seeded card exists.
      additionalProperties: false

    # --- Phase 18 -----------------------------------------------------------------------

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        language: { type: string, enum: [es, en], description: Language of the e-mail; omitted = Spanish. }
      additionalProperties: false

    PasswordResetWithCode:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
      additionalProperties: false

    SecondVisit:
      type: object
      description: >
        Second-visit rate, the console's first number (v3.0 decision 9). Cohort = customers
        whose card was created in the window; returned = those with an effective accrual or
        redemption on a later Ecuador calendar day than their enrolment (the first stamp
        given at sign-up does not count). Undone operations never count. rate is null when
        newCustomers = 0.
      required: [newCustomers, returned]
      properties:
        rate: { type: [number, "null"], description: "0–100, one decimal." }
        newCustomers: { type: integer }
        returned: { type: integer }
        previousRate: { type: [number, "null"], description: Same measure for the 30 days before (for the "+6 puntos" delta). }
      additionalProperties: false

    ProgramFigures:
      type: object
      required: [programId, activeCards, redemptions30d, newCards7d]
      properties:
        programId: { type: string, format: uuid }
        activeCards: { type: integer, description: Active (not paused) cards. }
        redemptions30d: { type: integer }
        newCards7d: { type: integer }
      additionalProperties: false

    ReportSummary:
      type: object
      required: [secondVisit, redemptionsThisMonth, programs]
      properties:
        secondVisit: { $ref: "#/components/schemas/SecondVisit" }
        redemptionsThisMonth: { type: integer, description: Redemptions in the current calendar month (Ecuador). }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramFigures" }
          description: One entry per campaign of the merchant (every status).
      additionalProperties: false

    ReportKpis:
      type: object
      required: [secondVisit, newCustomers, visits, redemptions]
      properties:
        secondVisit: { $ref: "#/components/schemas/SecondVisit" }
        newCustomers: { type: integer, description: Cards created in the period. }
        visits: { type: integer, description: Effective accruals (stamps or points) in the period. }
        redemptions: { type: integer, description: Effective redemptions in the period. }
      additionalProperties: false

    CohortWeek:
      type: object
      required: [weekStart, newCustomers, returned, closed]
      properties:
        weekStart: { type: string, format: date, description: Monday, Ecuador time. }
        newCustomers: { type: integer }
        returned: { type: integer, description: Came back within 30 days of their own enrolment. }
        rate: { type: [number, "null"], description: "0–100; null when newCustomers = 0." }
        closed: { type: boolean, description: "False while some of the week's customers are still inside their 30 days (\"en curso\", drawn striped)." }
      additionalProperties: false

    CampaignReportRow:
      type: object
      required: [programId, name, type, visits, redemptions]
      properties:
        programId: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/ProgramType" }
        visits: { type: integer }
        redemptions: { type: integer }
        secondVisitRate: { type: [number, "null"], description: Null for discount campaigns (single use). }
      additionalProperties: false

    LevelCount:
      type: object
      required: [level, count]
      properties:
        level: { type: integer, minimum: 1 }
        count: { type: integer }
      additionalProperties: false

    BranchReportRow:
      type: object
      required: [locationId, name, newCustomers, visits]
      properties:
        locationId: { type: string, format: uuid }
        name: { type: string }
        newCustomers: { type: integer, description: Customers who signed up at this branch in the period. }
        visits: { type: integer }
        secondVisitRate: { type: [number, "null"] }
      additionalProperties: false

    ReportOverview:
      type: object
      required: [periodStart, periodEnd, weeks, kpis, cohorts, campaigns, levels]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        weeks: { type: integer, enum: [4, 8, 12] }
        kpis: { $ref: "#/components/schemas/ReportKpis" }
        cohorts:
          type: array
          items: { $ref: "#/components/schemas/CohortWeek" }
          description: Oldest first, one per week of the period.
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/CampaignReportRow" }
        levels:
          type: array
          items: { $ref: "#/components/schemas/LevelCount" }
          description: Active accumulation cards per level, ascending.
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchReportRow" }
          description: Only with branch_reports (Pro) or for a manager (their branches).
      additionalProperties: false

    RecentOperation:
      type: object
      required: [id, cardId, kind, holderName, createdAt, undoable]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        kind: { type: string, enum: [accrue_stamps, accrue_points, redeem, birthday_redeem] }
        holderName: { type: string, description: "First name + initial (\"María T.\"), else \"Cliente\"." }
        programName: { type: string }
        stampsDelta: { type: integer }
        pointsDelta: { type: integer }
        locationId: { type: string, format: uuid }
        reversed: { type: boolean }
        undoable: { type: boolean, description: "True while POST /operations/{transactionId}/undo would succeed for the caller." }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    BirthdayReward:
      type: object
      required: [id, benefit, validUntil]
      properties:
        id: { type: string, format: uuid }
        benefit: { type: string, description: "e.g. \"Un postre de la casa\" or \"20 % en toda la carta\"." }
        validUntil: { type: string, format: date }
      additionalProperties: false

    CardBirthdayUpdate:
      type: object
      required: [cardId, token, day, month]
      properties:
        cardId: { type: string, format: uuid }
        token: { type: string, description: "Either the card's opaque token (CardIssued.card.opaqueToken, right after enrolment) or the signed token of the birthday link printed on the back of the pass (/tarjeta/{cardId}?t=…, D15 keeps the opaque token off visible text)." }
        day: { type: [integer, "null"], minimum: 1, maximum: 31 }
        month: { type: [integer, "null"], minimum: 1, maximum: 12 }
      additionalProperties: false

    NotificationUpdate:
      type: object
      description: Partial NotificationCreate for a scheduled notification.
      properties:
        type: { type: string, enum: [general, event, flash] }
        audience: { type: string, enum: [all, near, inactive, level, location] }
        levelMin: { type: integer, minimum: 2, maximum: 50 }
        locationId: { type: string, format: uuid }
        title: { type: string, maxLength: 60 }
        body: { type: string, minLength: 1, maxLength: 150 }
        url: { type: [string, "null"], maxLength: 500 }
        eventAt: { type: string, format: date-time }
        flashHours: { type: integer, minimum: 1, maximum: 72 }
        scheduledAt: { type: string, format: date-time }
      additionalProperties: false

    EnrollPreview:
      type: object
      required: [programId, businessName, programName, type, campaignStatus, birthdayOffer]
      properties:
        programId: { type: string, format: uuid }
        businessName: { type: string }
        programName: { type: string }
        type: { $ref: "#/components/schemas/ProgramType" }
        mechanic: { $ref: "#/components/schemas/RewardMechanic" }
        stampsForReward: { type: integer }
        pointsForReward: { type: integer }
        pointsPerDollar: { type: number }
        reward: { type: string }
        occasion: { type: string }
        discountPercent: { type: integer }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        campaignStatus: { $ref: "#/components/schemas/CampaignStatus" }
        color: { type: string, description: Pass background colour (hex). }
        logoUrl: { type: string }
        backgroundUrl: { type: string }
        birthdayOffer: { type: boolean, description: "The merchant gives a birthday gift (Pro, birthdays on): show the optional birthday step after saving." }
      additionalProperties: false
