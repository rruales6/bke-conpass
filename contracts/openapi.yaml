openapi: 3.1.0
info:
  title: conpass API
  version: 0.1.0
  description: >
    Loyalty & membership platform API. Single source of truth (contract-first).
    Backend is the authority for balances; wallet passes are display-only.
    Each tag maps to one single-responsibility Lambda service under backend/services.
  contact:
    name: conpass engineering
servers:
  - url: https://api.conpass.cards
    description: Production (frontend is served from https://conpass.cards)
  - url: http://localhost:3000
    description: Local (serverless offline)

tags:
  - name: health
    description: Liveness. Service:health
  - name: me
    description: Current authenticated identity. Service:identity
  - name: demo
    description: Public self-serve demo tenant context. Service:merchants
  - name: merchants
    description: Merchant (tenant) onboarding & subscription. Service:merchants
  - name: programs
    description: Loyalty/membership program config. Service:programs
  - name: enrollment
    description: Public customer enrollment → issue card. Service:enrollment
  - name: cards
    description: Issued card instances & wallet links. Service:cards
  - name: operations
    description: In-store accrue / redeem / validate. Service:operations
  - name: birthday
    description: Birthday benefit automation. Service:birthday
  - name: admin
    description: Platform-admin (cross-tenant). Service:admin
  - name: notifications
    description: >-
      Wallet notifications — automations, manual sends, audiences, history (Phase 16).
      Service:notifications (HTTP) + notifier (scheduled dispatcher, no HTTP).

security:
  - supabaseJwt: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Resolve the caller's identity, roles and tenant
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Set the caller's own password and clear the forced-change flag
      description: >
        Used on first login after a temporary password was emailed (Identity.mustChangePassword).
        Sets the new password and clears `must_change_password` in one Supabase admin update.
        The client must then sign in again with the new password (refresh tokens may be revoked).
        Refused (403) for the shared demo owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /demo:
    get:
      tags: [demo]
      operationId: getDemoContext
      summary: Public self-serve demo tenant context + shared test credentials
      description: >
        Returns the most-recently created demo merchant, its latest program, and the
        shared demo login, so the unauthenticated /demo sandbox can silently sign in and
        walk the full journey. Demo logins only ever see demo-flagged data (tenant RLS).
      security: []
      responses:
        "200":
          description: Demo context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoContext" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payment-settings:
    get:
      tags: [merchants]
      operationId: getPaymentSettings
      summary: Public — platform transfer/DEUNA account details shown on the signup page
      description: >
        The account a subscribing merchant transfers into (Función 02 · B2B): bank,
        account number, beneficiary, plus the DEUNA QR image. Platform-admin maintains
        these in Función 04, so they can change without a redeploy. Public by design —
        this is exactly the information a payer needs before transferring.
      security: []
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }

  /plans:
    get:
      tags: [merchants]
      operationId: listPlans
      summary: Public — the self-service plan catalog (price, inclusions, overage, features)
      description: >
        Single source of truth for pricing (business model §3, D17). Signup, the
        merchant panel and the admin console all read prices from here; nothing in the
        PWA hardcodes a price. Enterprise / white-label is off-catalog and never listed.
      security: []
      responses:
        "200":
          description: Plans, cheapest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }

  /payment-proofs/upload-url:
    post:
      tags: [merchants]
      operationId: createPaymentProofUploadUrl
      summary: Public — presigned S3 PUT URL for a manual-transfer payment proof
      description: >
        Signup is unauthenticated, and the proof must exist *before* the account can be
        activated, so this endpoint is public. It returns a short-lived presigned PUT to
        a PRIVATE bucket (receipts carry names, accounts and amounts); the returned
        storage key is submitted back as `payment.proofStorageKey` on POST /merchants,
        and only platform-admin can read the object back.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentProofUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofUploadResult" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants:
    post:
      tags: [merchants]
      operationId: onboardMerchant
      summary: Onboard a merchant (B2B signup → tenant + subscription + owner)
      description: >
        Payment is recorded as manual proof for now (PaymentProvider stub). For the
        manual-transfer / DEUNA methods `payment.proofStorageKey` is REQUIRED — the
        account cannot be activated without a receipt for platform-admin to confirm.
        The owner's temporary password is EMAILED to contactEmail (never returned);
        `ownerInviteSent` is false when that email could not be sent — the account still
        exists and platform-admin can resend credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantOnboardRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOnboardResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants/{merchantId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: getMerchant
      summary: Get a merchant profile + subscription
      responses:
        "200":
          description: Merchant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/usage:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: getMerchantUsage
      summary: Current plan, consumption against its inclusions, and the estimated monthly bill
      description: >
        Two-layer pricing (D17) — subscription + consumption. Active cards are a LEVEL
        metric (cards currently active, counted now), billed above the plan's inclusion
        at the plan's per-card rate. Notifications are counted per calendar month
        (push-delivered wallet notifications). The figure is an ESTIMATE for the manual
        billing workflow, not a charge. merchant_owner of that merchant, or platform_admin.
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/operation-users:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listOperationUsers
      summary: List cashier/operation accounts (tier-limited)
      responses:
        "200":
          description: Operation users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationUser" }
    post:
      tags: [merchants]
      operationId: addOperationUser
      summary: Add a cashier/operation account (enforces tier limit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUser" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /merchants/{merchantId}/operation-users/{operationUserId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/OperationUserId"
    patch:
      tags: [merchants]
      operationId: updateOperationUser
      summary: Edit a cashier/operation account (name / email / station)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [merchants]
      operationId: deleteOperationUser
      summary: Remove a cashier/operation account
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/{merchantId}/operation-users/{operationUserId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/OperationUserId"
    post:
      tags: [merchants]
      operationId: resetOperationUserPassword
      summary: Issue a new temporary password for a cashier/operation account
      responses:
        "200":
          description: New temporary password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationUserPasswordReset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: List programs for the caller's merchant
      parameters:
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Program" }
    post:
      tags: [programs]
      operationId: createProgram
      summary: Create & publish a program (enforces tier program limit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgram
      summary: Get a program
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [programs]
      operationId: updateProgram
      summary: Update program parameters / appearance / active state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /programs/{programId}/appearance-upload-url:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      tags: [programs]
      operationId: createAppearanceUploadUrl
      summary: Presigned S3 PUT URL for a program icon / background asset
      description: >
        Owner-only. Returns a short-lived presigned S3 PUT URL the browser uploads
        the image to directly, plus the storage key to persist via PATCH /programs
        and the public URL used on the card + Google Wallet pass.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppearanceUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceUploadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /programs/{programId}/enroll:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      tags: [enrollment]
      operationId: enrollCustomer
      summary: Public enrollment — issue a card for a customer
      description: >
        Critical B2C path: minimal/optional PII (data minimization). Returns the
        card with wallet add-links. Idempotent on (programId, dedupe key). Only an
        `active` campaign (see CampaignStatus) enrols: otherwise 422 with code
        `campaign_not_active` and details {status, validFrom?, validUntil?}. A
        seasonal_discount card is issued with one discount available.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Card issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardIssued" }
        "200":
          description: Idempotent replay — existing card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardIssued" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [cards]
      operationId: getCard
      summary: Get a card (balance is backend-authoritative)
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards/{cardId}/wallet-links:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [cards]
      operationId: getWalletLinks
      summary: Get (re)generated Add-to-Wallet links for a card
      responses:
        "200":
          description: Wallet links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletLinks" }

  /operations/resolve:
    post:
      tags: [operations]
      operationId: resolveScan
      summary: Resolve a scanned opaque token to a card + current balance
      description: Used by the cashier station after a QR scan or manual code entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanResolveRequest" }
      responses:
        "200":
          description: Resolved card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResolution" }
        "404": { $ref: "#/components/responses/NotFound" }

  /operations/accrue:
    post:
      tags: [operations]
      operationId: accrue
      summary: Accrue stamps or points (idempotent, offline-replayable)
      description: >
        Backend-authoritative mutation. Requires an Idempotency-Key; safe to replay
        after offline queueing. Enforces per-window fraud limits. Triggers async
        wallet-object update.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccrueRequest" }
      responses:
        "200":
          description: Accrued (new or idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /operations/redeem:
    post:
      tags: [operations]
      operationId: redeem
      summary: Redeem a reward (idempotent, server-validated)
      description: >
        For seasonal_discount this APPLIES THE DISCOUNT (one use per card). It requires the
        campaign to be `active` — otherwise 422 `campaign_not_active` with details
        {status, validFrom, validUntil} — and a second use is 409 `discount_already_used`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /operations/validate-access:
    post:
      tags: [operations]
      operationId: validateAccess
      summary: Validate a membership pass access (gym/event)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateAccessRequest" }
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessDecision" }

  /programs/{programId}/redemptions:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [operations]
      operationId: listRedemptions
      summary: Redemption report for a program
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Redemption" }

  /programs/{programId}/metrics:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      operationId: getProgramMetrics
      summary: Key metrics for a program (installs, second-visit, churn, redemptions)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramMetrics" }

  /programs/{programId}/birthday-automation:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    put:
      tags: [birthday]
      operationId: setBirthdayAutomation
      summary: Configure automatic birthday benefit issuance
      description: Pro only (feature `automated_campaigns`); other plans get 402 `feature_not_in_plan`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirthdayAutomation" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BirthdayAutomation" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /birthday-cards:
    post:
      tags: [birthday]
      operationId: issueBirthdayCard
      summary: Issue a unique birthday benefit card for a customer
      description: Pro only (feature `automated_campaigns`); other plans get 402 `feature_not_in_plan`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirthdayCardCreate" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BirthdayCard" }
        "402": { $ref: "#/components/responses/TierLimit" }

  /admin/clients:
    get:
      tags: [admin]
      operationId: listClients
      summary: Platform-admin — list all B2B clients with payment status
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminClient" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/clients/{merchantId}/subscription:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    patch:
      tags: [admin]
      operationId: updateSubscription
      summary: Platform-admin — change plan / mark paid / suspend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/clients/{merchantId}/payment-proof:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [admin]
      operationId: getClientPaymentProof
      summary: Platform-admin — short-lived link to the client's manual-transfer receipt
      description: >
        The proof lives in a private bucket; this mints a presigned GET so the admin can
        inspect it before marking the subscription paid. 404 when the client never
        uploaded one.
      responses:
        "200":
          description: Presigned download target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProofLink" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/clients/{merchantId}/resend-credentials:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    post:
      tags: [admin]
      operationId: resendOwnerCredentials
      summary: Platform-admin — issue a new temporary password for the owner and email it
      description: >
        Resets the owner's password to a fresh temporary one, re-flags the forced change
        at next login, and emails it. 409 for the demo merchant (shared password).
        503 when email is not configured (nothing changed). 502 when the password WAS
        reset but the email failed — retry, which issues another password.
      responses:
        "200":
          description: Credentials emailed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialsResent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/EmailDeliveryFailed" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /admin/payment-settings:
    patch:
      tags: [admin]
      operationId: updatePaymentSettings
      summary: Platform-admin — edit the transfer/DEUNA details shown on signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/payment-settings/qr-upload-url:
    post:
      tags: [admin]
      operationId: createPaymentQrUploadUrl
      summary: Platform-admin — presigned S3 PUT URL for the DEUNA QR image
      description: >
        The QR is displayed on the public signup page, so it goes to the public-read
        assets bucket; persist the returned `storageKey` via PATCH /admin/payment-settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentQrUploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceUploadResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/stats:
    get:
      tags: [admin]
      operationId: getPlatformStats
      summary: Platform-admin — MRR, active clients, overdue
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /merchants/{merchantId}/locations:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
    get:
      tags: [merchants]
      operationId: listLocations
      summary: The merchant's locales (stores) — every plan
      description: >
        Locales serve two purposes: the cashier picks one at scan time (so visits are
        attributed to a store), and up to 10 ACTIVE ones are sent to every program's
        wallet class as nearby-notification points — that second part only on plans with
        `nearby_notifications` (Growth+); on Starter they are stored and activate on upgrade.
      responses:
        "200":
          description: Locales, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [merchants]
      operationId: createLocation
      summary: Register a locale (name + decimal latitude/longitude)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "409":
          description: >-
            Would exceed 10 active locales (details.reason = active_location_limit). Create
            it with active=false, or pause another first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants/{merchantId}/locations/{locationId}:
    parameters:
      - $ref: "#/components/parameters/MerchantId"
      - $ref: "#/components/parameters/LocationId"
    patch:
      tags: [merchants]
      operationId: updateLocation
      summary: Edit / pause / resume a locale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Activating it would exceed 10 active locales (details.reason = active_location_limit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [merchants]
      operationId: deleteLocation
      summary: Delete a locale (past visits keep their history, unattributed)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The merchant's automations, balance-expiry window and per-card locations
      description: >
        Returns defaults when the merchant never saved settings. `platformRules` is
        read-only here (platform-admin sets it) and applies to automations and manual sends.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Save automations, balance-expiry window and per-card locations
      description: >
        Full replace. Enabling `inactive` needs `automated_campaigns` (Pro) → 402
        feature_not_in_plan. `expiry.enabled` with `balanceExpiryDays` null is accepted and
        inert (nothing expires, nothing is warned). warnDays not below balanceExpiryDays → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications/audiences:
    get:
      tags: [notifications]
      operationId: getNotificationAudiences
      summary: How many cards each manual-send audience reaches right now
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationAudiences" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: History — manual sends and daily automation batches, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Send (or schedule) a manual notification to an audience
      description: >
        Every plan may send `general` to `all`, without a link. `event`, `flash`, any other
        audience and `url` need `manual_campaigns` (Growth+) → 402 feature_not_in_plan.
        Delivery is asynchronous: the dispatcher applies the platform rules (daily cap per
        card, quiet hours) and pushes within about a minute. Notifications above the plan's
        inclusion are billed, never blocked (D17).
        **Public demo merchant** (is_demo): at most 3 manual sends per Ecuador day (any
        status, scheduled or cancelled included) → 429 `rate_limited` with
        details.reason = demo_daily_limit; its cards are deactivated 7 days after
        enrolment, so only recent demo cards receive anything; automations never run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationCreate" }
      responses:
        "202":
          description: Accepted — queued, or scheduled when scheduledAt is in the future
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "402": { $ref: "#/components/responses/TierLimit" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    delete:
      tags: [notifications]
      operationId: cancelNotification
      summary: Cancel a scheduled notification that has not started sending
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/notification-rules:
    get:
      tags: [admin]
      operationId: getNotificationRules
      summary: Platform-admin — sending rules applied to every merchant
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformNotificationRules" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updateNotificationRules
      summary: Platform-admin — change the daily cap per card and quiet hours
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformNotificationRulesUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformNotificationRules" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth (GoTrue) access token, validated via JWKS.

  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MerchantIdQuery:
      name: merchantId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationUserId:
      name: operationUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; makes the mutation safe to replay after offline queueing.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (e.g. duplicate or state conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TierLimit:
      description: >
        Plan limit reached (`tier_limit` — operation users) or the feature is not
        in the merchant's plan (`feature_not_in_plan`, details.feature + details.requiredTier).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotConfigured:
      description: A required provider is not configured on this deployment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EmailDeliveryFailed:
      description: The email could not be delivered to the SMTP server (`email_delivery_failed`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Per-window fraud/rate limit hit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine-readable error code }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        version: { type: string }

    Tier:
      type: string
      description: Self-service plans. Enterprise / white-label is quoted off-catalog (D17).
      enum: [starter, growth, pro]

    PlanFeature:
      type: string
      description: >
        campaigns = seasonal + accumulation campaigns (every plan); basic_notifications =
        basic notifications (every plan, within the plan's notification allowance);
        reports = reports + campaign dashboard; user_management = operation users;
        nearby_notifications = "Estás cerca"; manual_campaigns = personalised notifications
        + manual notification campaigns; automated_campaigns = seasonal campaigns and
        birthdays that launch themselves.
      enum: [campaigns, basic_notifications, reports, user_management, nearby_notifications, manual_campaigns, automated_campaigns]

    Plan:
      type: object
      required: [tier, priceUsd, includedCards, extraCardUsd, includedNotifications, features]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        priceUsd: { type: number, description: Monthly subscription, USD. }
        includedCards: { type: integer, description: Active cards included per month. }
        extraCardUsd: { type: number, description: USD per active card above the inclusion. }
        includedNotifications: { type: integer, description: "Notifications included per month (every plan has some since business model v2.0: 500 / 1 000 / 10 000)." }
        extraNotificationUsd: { type: number, description: "USD per notification above the inclusion (0.015 / 0.010 / 0.005). Absent only if a plan ever ships without notifications." }
        operationUserLimit: { type: integer, description: Absent = unlimited. }
        features:
          type: array
          items: { $ref: "#/components/schemas/PlanFeature" }
      additionalProperties: false

    PlanUsage:
      type: object
      required: [plan, activeCards, extraCards, extraCardsUsd, notificationsUsed, extraNotifications,
                 extraNotificationsUsd, estimatedTotalUsd, programCount, operationUserCount, periodStart]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        activeCards: { type: integer, description: Cards currently active (billing metric). }
        extraCards: { type: integer, description: max(0, activeCards - plan.includedCards). }
        extraCardsUsd: { type: number }
        notificationsUsed: { type: integer, description: "Wallet notifications delivered with a push this calendar month (UTC) — the billed figure." }
        extraNotifications: { type: integer }
        extraNotificationsUsd: { type: number }
        estimatedTotalUsd: { type: number, description: plan.priceUsd + both overages, rounded to cents. }
        programCount: { type: integer }
        operationUserCount: { type: integer }
        periodStart: { type: string, format: date, description: First day of the current billing month (UTC). }
      additionalProperties: false

    ProgramType:
      type: string
      description: >
        loyalty_stamps / loyalty_points = accumulation campaigns ("campaña de acumulación":
        collect towards a reward); seasonal_discount = seasonal campaign ("campaña de
        temporada": a discount for a special date, usable once per customer, only while the
        campaign is active); membership_pass = membership (unchanged).
      enum: [loyalty_stamps, loyalty_points, membership_pass, seasonal_discount]

    CampaignStatus:
      type: string
      description: >
        Read-only, computed on every read. disabled = switched off by the merchant (active
        false); upcoming / ended = a seasonal campaign before validFrom / after validUntil
        (Ecuador time); active = otherwise. Only `active` lets a customer enrol, and (for
        seasonal) lets the cashier apply the discount.
      enum: [active, upcoming, ended, disabled]

    RewardMechanic:
      type: string
      enum: [stamps, points]

    MembershipValidity:
      type: string
      enum: [monthly, quarterly, annual, per_event]

    PaymentStatus:
      type: string
      enum: [pending, paid, overdue, suspended]

    Role:
      type: string
      enum: [platform_admin, merchant_owner, operation_user, customer]

    Identity:
      type: object
      required: [userId, roles]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        merchantId:
          type: string
          format: uuid
          description: Present for merchant_owner / operation_user.
        station: { type: string, description: Operation-user station label (e.g. Caja 1). }
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationRef" }
          description: >-
            Active locales this user may scan at — an operation user's assigned ones, every
            active locale for the owner. Empty when the merchant registered none; the
            cashier screen asks for one only when there are two or more.
        mustChangePassword:
          type: boolean
          description: >-
            True while the user still holds an emailed temporary password; the PWA blocks
            every screen except the change-password page until POST /me/password succeeds.
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 8, maxLength: 72 }
      additionalProperties: false

    CredentialsResent:
      type: object
      required: [sent, email]
      properties:
        sent: { type: boolean }
        email: { type: string, format: email, description: Address the credentials were sent to. }
      additionalProperties: false

    MerchantOnboardRequest:
      type: object
      required: [businessName, ruc, category, city, contactName, contactEmail, tier, payment]
      properties:
        businessName: { type: string }
        ruc: { type: string, description: Ecuador tax id }
        category: { type: string, enum: [cafe_restaurant, gym, retail, events, other] }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        tier: { $ref: "#/components/schemas/Tier" }
        payment: { $ref: "#/components/schemas/PaymentSubmission" }
        language:
          type: string
          enum: [es, en]
          description: >-
            UI language at signup; the credentials email is written in it (also reused by
            admin resend). Omitted means Spanish. No OpenAPI `default` on purpose (codegen
            would emit a bare string, not the enum member); the handler falls back.
      additionalProperties: false

    PaymentSubmission:
      description: Stubbed payment. For now only manual proof is stored.
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [card, deuna, manual_transfer] }
        proofStorageKey:
          type: string
          description: >
            Private-bucket key of the uploaded receipt, from
            POST /payment-proofs/upload-url. REQUIRED for `deuna` / `manual_transfer`.
      additionalProperties: false

    PaymentSettings:
      description: >
        Platform-level transfer/DEUNA account the subscribing merchant pays into.
        Single record, maintained by platform-admin (Función 04) and read publicly by
        the signup page (Función 02).
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: >
            False until platform-admin fills in an account number — the signup page
            then tells the visitor to contact conpass instead of transferring blind.
        bankName: { type: string, description: "e.g. Banco Pichincha" }
        accountType: { type: string, enum: [savings, checking] }
        accountNumber: { type: string }
        beneficiaryName: { type: string, description: Account holder shown to the payer. }
        beneficiaryTaxId: { type: string, description: "Beneficiary RUC / cédula" }
        contactEmail: { type: string, description: Where payers may also send the receipt. }
        instructions: { type: string, description: Free-text note rendered under the details. }
        qrImageUrl:
          type: string
          description: Public HTTPS URL of the DEUNA QR image (null until one is uploaded).
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentSettingsUpdate:
      description: >
        Partial update. Every field is optional; an explicit empty string clears it.
        `qrStorageKey` comes from POST /admin/payment-settings/qr-upload-url.
      type: object
      properties:
        bankName: { type: string }
        accountType: { type: string, enum: [savings, checking] }
        accountNumber: { type: string }
        beneficiaryName: { type: string }
        beneficiaryTaxId: { type: string }
        contactEmail: { type: string }
        instructions: { type: string }
        qrStorageKey: { type: string }
      additionalProperties: false

    PaymentProofUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg, application/pdf] }
      additionalProperties: false

    PaymentProofUploadResult:
      type: object
      required: [uploadUrl, storageKey]
      properties:
        uploadUrl: { type: string, description: Short-lived presigned S3 PUT URL. }
        storageKey: { type: string, description: Submit as payment.proofStorageKey. }
      additionalProperties: false

    PaymentProofLink:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Short-lived presigned S3 GET URL. }
        uploadedAt: { type: string, format: date-time }
      additionalProperties: false

    PaymentQrUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg] }
      additionalProperties: false

    MerchantOnboardResult:
      type: object
      required: [merchant, subscription, ownerInviteSent, ownerEmail]
      properties:
        merchant: { $ref: "#/components/schemas/Merchant" }
        subscription: { $ref: "#/components/schemas/Subscription" }
        ownerInviteSent:
          type: boolean
          description: >-
            True when the temporary-password email was handed to the SMTP server. False means
            the account exists but the email failed; platform-admin can resend credentials.
        ownerEmail: { type: string, format: email, description: Login email for the owner account. }
      additionalProperties: false

    Merchant:
      type: object
      required: [id, businessName, city, category, createdAt]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        ruc: { type: string }
        category: { type: string }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        logoStorageKey: { type: string }
        subscription: { $ref: "#/components/schemas/Subscription" }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Subscription:
      type: object
      required: [tier, paymentStatus, priceUsd, includedCards]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        priceUsd: { type: number, description: The plan's monthly price, from the catalog. }
        includedCards: { type: integer, description: Active cards included — NOT a cap; extra cards are billed. }
        activeCards: { type: integer, description: Billing metric — cards currently active. }
        operationUserLimit: { type: integer, description: Absent = unlimited. }
        nextChargeAt: { type: string, format: date }
        lastPaymentAt: { type: string, format: date }
      additionalProperties: false

    SubscriptionUpdate:
      type: object
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
      additionalProperties: false

    OperationUser:
      type: object
      required: [id, name, email, station, locationIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (empty = none assigned).
        tempPassword:
          type: string
          description: Temporary password, returned only when the operator is first created.
      additionalProperties: false

    OperationUserCreate:
      type: object
      required: [name, email, station]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (owner decision, Phase 16). Replaces the set when sent.
      additionalProperties: false

    OperationUserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        station: { type: string, enum: [caja_1, caja_2, door_access] }
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: Locales this cashier may work at (owner decision, Phase 16). Replaces the set when sent.
      additionalProperties: false

    OperationUserPasswordReset:
      type: object
      required: [id, tempPassword]
      properties:
        id: { type: string, format: uuid }
        tempPassword: { type: string, description: Newly issued temporary password. }
      additionalProperties: false

    ProgramAppearance:
      type: object
      description: >
        Card look. `color` is the pass background colour and is always meaningful: Google
        Wallet does NOT derive a background from the hero image (it falls back to its own
        default), so a merchant that wants a specific colour must set one even when an
        image is used. `backgroundStorageKey` is the hero image drawn ON that colour — the
        two combine rather than compete, and a transparent PNG lets the colour show
        through. Empty string clears a field (writes NULL); omitting a field on PATCH
        leaves it unchanged. The icon is independent of both.
      properties:
        color: { type: string, description: "Hex background colour of the pass. Empty string clears it. Combines with backgroundStorageKey." }
        iconStorageKey: { type: string, description: "Pass logo. PNG, 660x660 minimum, 1:1 (Google Wallet logo spec). Empty string clears it." }
        backgroundStorageKey: { type: string, description: "Pass hero image, drawn over the background colour. PNG recommended (a transparent PNG lets the colour show through), 1032x812, ~5:4 — near-square, no embedded text, 20dp breathing room top and bottom (Google Wallet hero-image spec). JPEG accepted. Empty string clears it." }
        iconUrl: { type: string, description: Public URL for the icon (read-only). }
        backgroundUrl: { type: string, description: Public URL for the background (read-only). }
      additionalProperties: false

    AppearanceUploadRequest:
      type: object
      required: [kind, contentType]
      properties:
        kind: { type: string, enum: [icon, background] }
        contentType: { type: string, enum: [image/png, image/jpeg] }
      additionalProperties: false

    AppearanceUploadResult:
      type: object
      required: [uploadUrl, storageKey, publicUrl]
      properties:
        uploadUrl: { type: string, description: Presigned S3 PUT URL (short-lived). }
        storageKey: { type: string, description: S3 key to persist via PATCH /programs appearance. }
        publicUrl: { type: string, description: Public HTTPS URL for the uploaded asset. }
      additionalProperties: false

    ProgramCreate:
      type: object
      required: [type, name, appearance, wallets]
      properties:
        type: { $ref: "#/components/schemas/ProgramType" }
        name: { type: string }
        mechanic: { $ref: "#/components/schemas/RewardMechanic" }
        stampsForReward: { type: integer, minimum: 1 }
        pointsForReward: { type: integer, minimum: 1 }
        pointsPerDollar: { type: number, minimum: 0 }
        reward: { type: string, description: Reward description shown on the card. }
        membershipValidity: { $ref: "#/components/schemas/MembershipValidity" }
        membershipIncludes: { type: string }
        welcomeBonus: { type: integer, default: 0 }
        expiryDays: { type: integer, description: Balance expiry window; null = no expiry. }
        occasion: { type: string, description: "seasonal_discount: the special date it celebrates, e.g. \"Día de la Madre\"." }
        discountPercent: { type: integer, minimum: 1, maximum: 100, description: "seasonal_discount: the discount. At least one of discountPercent / reward is required; reward is the free-text offer (\"2x1 en postres\")." }
        validFrom: { type: string, format: date, description: "seasonal_discount (required): first day the campaign is active, inclusive, Ecuador time." }
        validUntil: { type: string, format: date, description: "seasonal_discount (required): last day the campaign is active, inclusive, Ecuador time. Must be >= validFrom." }
        inactivityDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: >
            Accumulation campaigns (loyalty_stamps / loyalty_points) only: a card with no
            activity (no accrual or redemption, counted from enrolment) for this many days
            counts as abandoned in ProgramMetrics.churnRate. Absent = 90. Ignored for
            membership_pass. No `default:` on purpose — the handler applies 90.
        appearance: { $ref: "#/components/schemas/ProgramAppearance" }
        wallets:
          type: array
          items: { type: string, enum: [apple, google] }
          minItems: 1
      additionalProperties: false

    ProgramUpdate:
      type: object
      properties:
        name: { type: string }
        reward: { type: string }
        stampsForReward: { type: integer, minimum: 1 }
        pointsForReward: { type: integer, minimum: 1 }
        pointsPerDollar: { type: number, minimum: 0 }
        inactivityDays: { type: integer, minimum: 1, maximum: 3650, description: See ProgramCreate.inactivityDays. }
        occasion: { type: string, description: "seasonal_discount only. Empty string clears it." }
        discountPercent: { type: integer, minimum: 1, maximum: 100, description: seasonal_discount only. }
        validFrom: { type: string, format: date, description: seasonal_discount only. }
        validUntil: { type: string, format: date, description: "seasonal_discount only. The merged row must still satisfy the ProgramCreate rules (dates present, validUntil >= validFrom, an offer)." }
        appearance: { $ref: "#/components/schemas/ProgramAppearance" }
        active: { type: boolean }
      additionalProperties: false

    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramCreate"
        - type: object
          required: [id, merchantId, active, createdAt]
          properties:
            id: { type: string, format: uuid }
            merchantId: { type: string, format: uuid }
            active: { type: boolean }
            campaignStatus: { $ref: "#/components/schemas/CampaignStatus" }
            enrollmentUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }

    EnrollmentRequest:
      description: Minimal PII by design; all personal fields optional.
      type: object
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: WhatsApp number. }
        birthday: { type: string, format: date }
        accessCode: { type: string, description: Required for exclusive/membership programs. }
        consent: { type: boolean, description: Consent to WhatsApp/email comms. }
        dedupeKey:
          type: string
          description: Optional client key to dedupe repeat submissions from the same device.
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the customer signed up at (enrol link `?local=<id>`). Ignored when it is
            not an active locale of the program's merchant — never fails the enrolment.
        language:
          type: string
          enum: [es, en]
          description: >-
            UI language the customer had selected when submitting the form; drives the
            labels on their wallet pass. Omitted means Spanish. Deliberately carries no
            OpenAPI `default`: datamodel-codegen emits one as a bare string rather than
            an enum member, so every request model would fail its own enum on
            serialization. The fallback lives in the handler instead.
      additionalProperties: false

    Card:
      type: object
      required: [id, programId, merchantId, type, balance, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ProgramType" }
        opaqueToken: { type: string, description: Opaque per-member id encoded in the QR. }
        balance: { $ref: "#/components/schemas/Balance" }
        holderName: { type: string, description: Display name (e.g. "María T."). }
        language: { type: string, enum: [es, en] }
        active: { type: boolean }
        walletInstalled: { type: boolean, description: Drives the active-pass billing metric. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Balance:
      description: >
        Backend-authoritative. Wallet is display-only. For seasonal_discount, a card is
        issued with rewardsAvailable 1; applying the discount moves it to rewardsRedeemed
        (so rewardsRedeemed >= 1 means "used"). `mechanic` carries no meaning for
        membership_pass / seasonal_discount.
      type: object
      required: [mechanic]
      properties:
        mechanic: { $ref: "#/components/schemas/RewardMechanic" }
        stamps: { type: integer, minimum: 0 }
        stampsForReward: { type: integer }
        points: { type: integer, minimum: 0 }
        pointsForReward: { type: integer }
        rewardsAvailable: { type: integer, minimum: 0, description: Rewards earned and not yet claimed. }
        rewardsRedeemed: { type: integer, minimum: 0, description: Rewards already claimed — never decreases. }
        membershipActiveUntil: { type: string, format: date }
      additionalProperties: false

    WalletLinks:
      type: object
      properties:
        google: { type: string, format: uri, description: Add to Google Wallet (signed JWT save link). }
        apple: { type: string, format: uri, description: Add to Apple Wallet (.pkpass) — future. }
      additionalProperties: false

    CardIssued:
      type: object
      required: [card, walletLinks]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        walletLinks: { $ref: "#/components/schemas/WalletLinks" }
      additionalProperties: false

    ScanResolveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Scanned opaque token or manually-entered code. }
      additionalProperties: false

    CardResolution:
      type: object
      required: [card, program]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        program: { $ref: "#/components/schemas/Program" }
      additionalProperties: false

    AccrueRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid }
        stamps: { type: integer, minimum: 1, description: Stamps to add (stamps mechanic). }
        amount: { type: number, minimum: 0, description: Purchase amount → points (points mechanic). }
        occurredAt:
          type: string
          format: date-time
          description: Client timestamp of the in-store event (for offline replay ordering).
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the scan happens at. Must be an active locale of the card's merchant and,
            for an operation user, one assigned to them (else 422). Optional — omitted when
            the merchant has no locales.
      additionalProperties: false

    RedeemRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        locationId:
          type: string
          format: uuid
          description: >-
            Locale the scan happens at. Must be an active locale of the card's merchant and,
            for an operation user, one assigned to them (else 422). Optional — omitted when
            the merchant has no locales.
      additionalProperties: false

    ValidateAccessRequest:
      type: object
      required: [cardId, operationUserId]
      properties:
        cardId: { type: string, format: uuid }
        operationUserId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
      additionalProperties: false

    OperationResult:
      type: object
      required: [card, transaction]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        transaction: { $ref: "#/components/schemas/Transaction" }
        walletUpdateQueued: { type: boolean }
      additionalProperties: false

    Transaction:
      type: object
      required: [id, cardId, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        kind: { type: string, enum: [accrue_stamps, accrue_points, redeem, validate_access, birthday_issue] }
        stampsDelta: { type: integer }
        pointsDelta: { type: integer }
        operationUserId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    AccessDecision:
      type: object
      required: [cardId, granted]
      properties:
        cardId: { type: string, format: uuid }
        granted: { type: boolean }
        reason: { type: string }
        validUntil: { type: string, format: date }
      additionalProperties: false

    Redemption:
      type: object
      required: [id, customerName, programId, reward, redeemedAt]
      properties:
        id: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: string, format: email }
        programId: { type: string, format: uuid }
        program: { type: string }
        reward: { type: string }
        redeemedAt: { type: string, format: date-time }
      additionalProperties: false

    ProgramMetrics:
      type: object
      properties:
        secondVisitRate30d: { type: number, description: "% of new customers returning within 30d." }
        activeInstalledPasses: { type: integer }
        installsThisWeek: { type: integer }
        visits: { type: integer }
        redemptions: { type: integer }
        churnRate:
          type: number
          description: >
            Abandonment rate ("tasa de abandono"): % of active cards with no activity in the
            last `inactivityDays` days (last accrual/redemption, or enrolment if none).
            Accumulation campaigns only — omitted for membership_pass.
        inactivityDays: { type: integer, description: "The N used for churnRate (the program's setting, 90 when unset). Omitted for membership_pass." }
        eligibleForReminder: { type: integer, description: Customers 1 stamp/step from reward. }
      additionalProperties: false

    BirthdayAutomation:
      type: object
      required: [enabled, benefitType]
      properties:
        enabled: { type: boolean }
        benefitType: { type: string, enum: [discount, gift] }
        discountPercent: { type: integer, minimum: 1, maximum: 100 }
        gift: { type: string }
        validityDays: { type: integer, minimum: 1 }
      additionalProperties: false

    BirthdayCardCreate:
      type: object
      required: [programId, customerId]
      properties:
        programId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
      additionalProperties: false

    BirthdayCard:
      type: object
      required: [id, code, customerName, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: Unique irreproducible code (e.g. CUMPLE-3F9A). }
        customerName: { type: string }
        benefit: { type: string }
        validUntil: { type: string, format: date }
        status: { type: string, enum: [pending, issued, redeemed, expired] }
        walletLinks: { $ref: "#/components/schemas/WalletLinks" }
      additionalProperties: false

    AdminClient:
      type: object
      required: [merchantId, name, city, tier, paymentStatus, priceUsd, activeCards, includedCards, estimatedMonthlyUsd]
      properties:
        merchantId: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        priceUsd: { type: number, description: Plan subscription price. }
        activeCards: { type: integer }
        includedCards: { type: integer }
        estimatedMonthlyUsd: { type: number, description: Subscription + card overage + notification overage. }
        since: { type: string, format: date }
        nextChargeAt: { type: string, format: date }
        lastPaymentAt: { type: string, format: date }
        hasPaymentProof:
          type: boolean
          description: >
            True when the client uploaded a manual-transfer receipt at signup — the admin
            can then open it via GET /admin/clients/{merchantId}/payment-proof.
        paymentProofUploadedAt: { type: string, format: date-time }
      additionalProperties: false

    PlatformStats:
      type: object
      required: [activeClients, mrrUsd, subscriptionMrrUsd, tierCounts]
      properties:
        activeClients: { type: integer }
        mrrUsd: { type: number, description: Sum of estimatedMonthlyUsd over PAID clients (subscription + overage). }
        subscriptionMrrUsd: { type: number, description: Subscription part only, paid clients. }
        tierCounts:
          type: object
          required: [starter, growth, pro]
          properties:
            starter: { type: integer }
            growth: { type: integer }
            pro: { type: integer }
          additionalProperties: false
        overdueCount: { type: integer }
      additionalProperties: false

    LocationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      additionalProperties: false

    Location:
      type: object
      required: [id, name, latitude, longitude, active, enrollmentQuery, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean, description: Only active locales are scannable and sent to the wallet. }
        enrollmentQuery:
          type: string
          description: Query string to append to any enrol link so sign-ups are attributed here (e.g. "local=<id>").
        operationUserCount: { type: integer, description: Cashiers assigned to this locale. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    LocationCreate:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90, description: "Decimal degrees, negative south (e.g. -0.18065)." }
        longitude: { type: number, minimum: -180, maximum: 180, description: "Decimal degrees, negative west (e.g. -78.48443)." }
        active: { type: boolean, description: Defaults to true. }
      additionalProperties: false

    LocationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean }
      additionalProperties: false

    ToggleAutomation:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
      additionalProperties: false

    NearAutomation:
      type: object
      required: [enabled, stamps, points]
      description: >-
        «Meta próxima» — one general threshold for all stamps campaigns and one for all
        points campaigns. Fires once when a visit brings the card within the threshold.
      properties:
        enabled: { type: boolean }
        stamps: { type: integer, minimum: 1, maximum: 4, description: Notify when this many stamps or fewer are missing. }
        points: { type: integer, minimum: 5, maximum: 50, multipleOf: 5, description: Notify when this many points or fewer are missing. }
      additionalProperties: false

    MilestoneAutomation:
      type: object
      required: [enabled, every]
      properties:
        enabled: { type: boolean }
        every: { type: integer, minimum: 5, maximum: 50, multipleOf: 5, description: Every N visits (accruals) on a card. }
      additionalProperties: false

    ExpiryAutomation:
      type: object
      required: [enabled, warnDays]
      description: Warns before balanceExpiryDays without a visit zeroes the balance. Inert while balanceExpiryDays is null.
      properties:
        enabled: { type: boolean }
        warnDays: { type: integer, minimum: 1, maximum: 30, description: Days before expiry. }
      additionalProperties: false

    InactiveAutomation:
      type: object
      required: [enabled, days]
      description: "\"Recordatorio de avance\" — Pro (automated_campaigns)."
      properties:
        enabled: { type: boolean }
        days: { type: integer, minimum: 7, maximum: 90, multipleOf: 7, description: Days without a visit. }
      additionalProperties: false

    NotificationAutomations:
      type: object
      required: [balance, ready, near, milestone, expiry, inactive]
      properties:
        balance: { $ref: "#/components/schemas/ToggleAutomation" }
        ready: { $ref: "#/components/schemas/ToggleAutomation" }
        near: { $ref: "#/components/schemas/NearAutomation" }
        milestone: { $ref: "#/components/schemas/MilestoneAutomation" }
        expiry: { $ref: "#/components/schemas/ExpiryAutomation" }
        inactive: { $ref: "#/components/schemas/InactiveAutomation" }
      additionalProperties: false

    CardLocationSettings:
      type: object
      required: [enrolled, topVisited]
      description: Per-card (object) wallet locations, on top of the program's locales. At most 10 per card. Growth+ like all nearby points.
      properties:
        enrolled: { type: boolean, description: Add the locale where the customer signed up. }
        topVisited: { type: boolean, description: Add the locales the customer visited most (cashier scans). }
      additionalProperties: false

    NotificationSettingsUpdate:
      type: object
      required: [automations, balanceExpiryDays, cardLocations]
      properties:
        automations: { $ref: "#/components/schemas/NotificationAutomations" }
        balanceExpiryDays:
          type: [integer, "null"]
          minimum: 7
          maximum: 365
          description: >-
            Merchant-wide (owner decision): stamps/points expire after this many days without
            a visit — the balance goes to 0, earned rewards are kept. null = never expire.
        cardLocations: { $ref: "#/components/schemas/CardLocationSettings" }
      additionalProperties: false

    NotificationSettings:
      type: object
      required: [automations, balanceExpiryDays, cardLocations, platformRules]
      properties:
        automations: { $ref: "#/components/schemas/NotificationAutomations" }
        balanceExpiryDays: { type: [integer, "null"] }
        cardLocations: { $ref: "#/components/schemas/CardLocationSettings" }
        platformRules: { $ref: "#/components/schemas/PlatformNotificationRules" }
      additionalProperties: false

    PlatformNotificationRules:
      type: object
      required: [capPerDay, quietHoursEnabled, quietStart, quietEnd, timezone]
      properties:
        capPerDay: { type: integer, minimum: 1, maximum: 3, description: Max notifications per card per rolling 24 h. Google allows 3. }
        quietHoursEnabled: { type: boolean, description: When on, nothing is pushed between quietStart and quietEnd; it goes out at quietEnd. }
        quietStart: { type: string, description: "Fixed \"21:00\"." }
        quietEnd: { type: string, description: "Fixed \"08:00\"." }
        timezone: { type: string, description: "Fixed \"America/Guayaquil\"." }
      additionalProperties: false

    PlatformNotificationRulesUpdate:
      type: object
      properties:
        capPerDay: { type: integer, minimum: 1, maximum: 3 }
        quietHoursEnabled: { type: boolean }
      additionalProperties: false

    AudienceCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }
        levelMin: { type: integer, description: For level counts. }
        locationId: { type: string, format: uuid, description: For locale counts. }
        name: { type: string, description: Locale name, for locale counts. }
      additionalProperties: false

    NotificationAudiences:
      type: object
      required: [all, near, inactive, levels, locations]
      properties:
        all: { type: integer, description: Every notifiable card — also "Tarjetas que reciben". }
        near: { type: integer, description: Within the merchant's near-goal thresholds. }
        inactive: { type: integer, description: No visit in 30 days. }
        levels:
          type: array
          items: { $ref: "#/components/schemas/AudienceCount" }
          description: Cards at level >= levelMin, for levelMin 2..10.
        locations:
          type: array
          items: { $ref: "#/components/schemas/AudienceCount" }
          description: One entry per active locale — customers who signed up or scanned there.
      additionalProperties: false

    NotificationCreate:
      type: object
      required: [type, audience, body]
      properties:
        type: { type: string, enum: [general, event, flash], description: "general = Aviso general (every plan); event, flash = Growth+." }
        audience: { type: string, enum: [all, near, inactive, level, location], description: Anything but all = Growth+. }
        levelMin: { type: integer, minimum: 2, maximum: 50, description: Required when audience = level. }
        locationId: { type: string, format: uuid, description: Required when audience = location. }
        title: { type: string, maxLength: 60, description: Message header; defaults to the business name. }
        body: { type: string, minLength: 1, maxLength: 150 }
        url: { type: string, maxLength: 500, pattern: "^https://", description: Optional "more information" link (Growth+); must relate to the program. }
        eventAt: { type: string, format: date-time, description: Required when type = event. The message hides from the pass 6 h after it. }
        flashHours: { type: integer, minimum: 1, maximum: 72, description: Required when type = flash. The message hides from the pass when the offer closes. }
        scheduledAt: { type: string, format: date-time, description: Omit to send now; otherwise a future instant (max 60 days ahead). }
      additionalProperties: false

    Notification:
      type: object
      required: [id, source, type, audience, body, status, recipients, delivered, visits48h, createdAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [manual, automation] }
        type: { type: string, enum: [general, event, flash, balance, ready, near, milestone, expiry, inactive] }
        audience: { type: string, enum: [all, near, inactive, level, location, automatic] }
        levelMin: { type: integer }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        title: { type: string }
        body: { type: string, description: For automations, a sample of the day's message (texts are personalised per card). }
        url: { type: string }
        eventAt: { type: string, format: date-time }
        flashHours: { type: integer }
        status: { type: string, enum: [scheduled, queued, sent, cancelled] }
        scheduledAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        day: { type: string, format: date, description: Automations — the Ecuador day this batch covers. }
        recipients: { type: integer, description: Cards targeted. }
        delivered: { type: integer, description: Cards the wallet accepted the message for. }
        visits48h: { type: integer, description: Recipients with a visit or redemption within 48 h of their delivery. }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    DemoContext:
      type: object
      required: [merchantId, businessName, programId, ownerEmail, ownerPassword]
      properties:
        merchantId: { type: string, format: uuid }
        businessName: { type: string }
        programId: { type: string, format: uuid, description: Latest program of the demo merchant — the public enroll journey targets it. }
        ownerEmail: { type: string, format: email }
        ownerPassword: { type: string, description: "Shared demo password — intentionally public (sandbox account, demo-only data)." }
        sampleCardCode:
          type: string
          description: >
            Opaque code of the seeded demo customer's active card (preferring the one in
            `programId`, else their most recent in any demo program), so the demo cashier
            can be pre-filled. Demo-only data; omitted when no seeded card exists.
      additionalProperties: false
