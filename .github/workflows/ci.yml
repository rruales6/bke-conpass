name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r layers/common/requirements.txt -r requirements-dev.txt

      - name: Validate contract & regenerate models (must be committed & unchanged)
        run: |
          bash scripts/codegen.sh
          git diff --exit-code layers/common/python/conpass_common/models.py \
            || (echo "::error::models.py is stale — run scripts/codegen.sh and commit"; exit 1)

      - name: Lint
        run: ruff check .

      - name: Validate SQL migrations parse
        run: |
          python - <<'PY'
          import glob, pglast
          for f in sorted(glob.glob('db/migrations/*.sql')):
              pglast.parse_sql(open(f).read())
              print("parsed", f)
          PY

      - name: Test
        run: pytest
